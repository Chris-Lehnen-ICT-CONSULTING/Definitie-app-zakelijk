# Bronnenlijst van de bronbibliotheek (DEF-620, RAG fase 3).
#
# Elke regel wordt één collectie in data/bronnen.db. De versie staat in de
# collectienaam, zodat een gebruiker bewust kiest welke tekst als context
# dient (bijv. huidig Sv naast nieuw Sv). Vastgesteld met Chris op 06-10-2026;
# BWB-id's en geldigheidsdata gecontroleerd via de SRU-zoekservice
# (zoekservice.overheid.nl) op 06-10-2026.
#
# formaat:
#   bwb  geldende toestand uit het Basiswettenbestand (wetten.overheid.nl)
#   op   officiële publicatie (Staatsblad) uit officielebekendmakingen.nl
#   eu   EU-verordening (Nederlands, XHTML) uit Cellar (publications.europa.eu)
#
# Regelingenregister (DEF-846, vastgesteld met Chris op 10-10-2026): deze lijst
# is ook de matrix wet- en regelgeving × rechtsgebied en de enige bron voor de
# keuzelijst "wettelijke basis" (domain.sources.regelingen).
#   label           naam in de keuzelijst (uniek, ook ongeacht hoofdletters)
#   naam            officiële naam
#   aliassen        eerdere labels die nog in opgeslagen definities staan
#   rechtsgebieden  sleutels uit domain.rechtsgebieden; het eerste is het
#                   hoofdrechtsgebied dat bij import als fragmentmetadata meegaat
#   kenmerken       alleen_expliciete_keuze: telt niet mee via een rechtsgebied
#                   alle_rechtsgebieden: hoort bij elk rechtsgebied (geen lijst)
#   toelichting     motivering van de rechtsgebieden
# Een regeling zonder formaat is kiesbaar, maar heeft geen bibliotheekbron.
# Een combinatie buiten de matrix geeft een waarschuwing, geen blokkade.
# Achtergrond: docs/analyses/2026-10-09-rag-meting/matrix-concept-v2.md
#
# Bewust NIET opgenomen (wijzigingswetten; hun BWB-tekst bevat alleen
# wijzigingsopdrachten, de inhoud staat in de wetten hieronder):
#   Wet identiteitsvaststelling verdachten, veroordeelden en getuigen (BWBR0026180)
#   Wet straffen en beschermen (BWBR0043990)
#   Wet modernisering elektronisch bestuurlijk verkeer (BWBR0048252)

