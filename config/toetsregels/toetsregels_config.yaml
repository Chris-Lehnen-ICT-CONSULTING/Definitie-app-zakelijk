# Root-SSOT voor het toetsregelsysteem (ADR-001 / DEF-606).
#
# Dit bestand is niet beschrijvend maar gezaghebbend: de sectie
# `runtime_contract` hieronder wordt bij het laden gelezen en tegen de
# Python-enums in src/toetsregels/runtime_contract.py gelegd. Wijkt de een
# van de ander af, dan faalt het laden zichtbaar met een RuleContractError.
# Voeg je hier een evaluator of statuswaarde toe, dan hoort de enum mee te
# bewegen (en andersom) — anders ontstaat er weer een tweede waarheid.
#
# De 53 JSON-bestanden onder src/toetsregels/regels/ zijn de versioned
# uitvoerbare regelrecords die door deze configuratie worden aangewezen.
version: "1.1"
created: "2025-10-02"
updated: "2026-08-12"
description: >
  Gezaghebbende configuratie voor het laden van validatieregels, het
  uitvoerbare regelcontract, prioriteitsordening, categoriegewichten en
  scoringbeleid.

# Rules loading configuration
loading:
  auto_load: true
  load_on_startup: true
  lazy_load: false

  # DEF-606 / ADR-001: JSON is het enige actieve runtimeformaat.
  formats:
    json:
      enabled: true
      path: "src/toetsregels/regels"
      pattern: "*.json"
      required_fields:
        - "id"
        - "naam"
        - "uitleg"
        - "prioriteit"
        - "runtime_contract"

    # De Pythonlagen onder src/toetsregels/regels/*.py en
    # src/toetsregels/validators/*.py zijn historische voorgangers; zij
    # draaien niet en zijn geen bron voor runtimegedrag. De bestanden staan
    # er nog tot de afzonderlijk goed te keuren verwijderingsfase (ADR-001).
    python:
      enabled: false

  # Consistency checks
  consistency:
    # Beide formaten hoeven niet synchroon te zijn: er is nog maar één
    # actief formaat. Het contract wordt op het JSON-record afgedwongen.
    require_both_formats: false
    validate_on_load: true
    check_id_match: true

# DEF-606 / ADR-001: het uitvoerbare regelcontract. Ieder JSON-record
# declareert in zijn blok `runtime_contract` precies één evaluatorstrategie,
# de vereiste invoer, een uitvoerbaarheidsklasse, een automatiseringsstatus
# en een scorepolicy. Onbekende waarden laten het laden zichtbaar falen
# (RuleContractError) in plaats van stil een tweede waarheid toe te staan.
# Bron van waarheid voor deze sets: src/toetsregels/runtime_contract.py.
runtime_contract:
  required_fields:
    - "evaluator"
    - "required_inputs"
    - "executability"
    - "automation_status"
    - "score_policy"

  evaluators:
    - "generic"
    - "positive_indicator"
    - "abbreviation"
    - "lemma_morphology"
    - "definition_grammar"
    - "qualification"
    - "definition_overlap"
    - "compound"
    - "definition_graph"
    - "preferred_term"
    - "synonym_consistency"
    - "context_metadata"
    - "ontological_category"
    - "duplicate_detection"
    - "judgment_review"

  required_inputs:
    - "definition_text"
    - "term"
    - "context_lists"
    - "ontological_category"
    - "definition_repository"
    - "synonyms"
    - "preferred_term"
    - "related_concepts"

  executability: ["deterministic", "repository", "judgment", "not_automatable"]
  automation_status: ["automated", "review_required", "not_evaluated"]
  score_policy: ["scored", "excluded_from_score"]

  # Uitkomst van één regelevaluatie. Alleen pass en fail zijn werkelijk
  # uitgevoerde, betrouwbare beoordelingen.
  result_status: ["pass", "fail", "review_required", "not_evaluated", "error"]


  # De volledige, verwachte regel-ID-set. Dit is de onafhankelijke
  # manifestatie waartegen beide laders de bestanden op disk leggen.
  # Zonder deze lijst zou de volledigheidscontrole de directory-glob
  # als eigen verwachting gebruiken en dus tautologisch zijn: een
  # verdwenen regelbestand wordt dan ook niet meer verwacht.
  # Ontbrekende en onverwachte bestanden leveren beide een
  # RuleContractError op.
  rule_ids:
    - "ARAI-01"
    - "ARAI-02"
    - "ARAI-02SUB1"
    - "ARAI-02SUB2"
    - "ARAI-03"
    - "ARAI-04"
    - "ARAI-04SUB1"
    - "ARAI-05"
    - "ARAI-06"
    - "CON-01"
    - "CON-02"
    - "CON-CIRC-001"
    - "DUP_01"
    - "ESS-01"
    - "ESS-02"
    - "ESS-03"
    - "ESS-04"
    - "ESS-05"
    - "ESS-CONT-001"
    - "INT-01"
    - "INT-02"
    - "INT-03"
    - "INT-04"
    - "INT-06"
    - "INT-07"
    - "INT-08"
    - "INT-09"
    - "INT-10"
    - "SAM-01"
    - "SAM-02"
    - "SAM-03"
    - "SAM-04"
    - "SAM-05"
    - "SAM-06"
    - "SAM-07"
    - "SAM-08"
    - "STR-01"
    - "STR-02"
    - "STR-03"
    - "STR-04"
    - "STR-05"
    - "STR-06"
    - "STR-07"
    - "STR-08"
    - "STR-09"
    - "STR-ORG-001"
    - "STR-TERM-001"
    - "VAL-EMP-001"
    - "VAL-LEN-001"
    - "VAL-LEN-002"
    - "VER-01"
    - "VER-02"
    - "VER-03"

  # Voorbeeldpaar-beleid: de gedocumenteerde goed/fout-paren zijn normatieve
  # regressiecases. Afwijken mag, maar alleen met reden én tracker-ID.
  example_pair_policy:
    - "normative"
    - "requires_repository"
    - "review_policy"
    - "source_defect"

# DEF-394: coarse prefix -> violation-category mapping (single source).
# Consumed by services/validation/violation_builder.category_for_rule().
# Volgorde = matchvolgorde; houd in sync met de code-fallback _CATEGORY_PREFIXES.
violation_category_prefixes:
  "STR-": structuur
  "CON-": samenhang
  "ESS-": juridisch
  "VAL-": juridisch
  "SAM-": samenhang
  "ARAI": taal
  "ARAI-": taal
  "AR-": taal
  "AR": taal
  "INT-": structuur
  "VER-": taal
  "LANG-": taal

# Priority ordering
priority:
  levels:
    high:
      weight: 1.0
      blocking: false
      categories: ["ARAI", "CON", "ESS", "VER"]

    medium:
      weight: 0.8
      blocking: false
      categories: ["INT", "SAM"]

    low:
      weight: 0.5
      blocking: false
      categories: ["STR", "DUP"]

  # Execution order
  execution_order: "category_priority"  # category_priority, rule_priority, alphabetical

# Scoring configuration
scoring:
  algorithm: "weighted_average"
  description: >
    Gewogen gemiddelde over uitsluitend werkelijk uitgevoerde beoordelingen
    (resultaatstatus pass of fail). DEF-624: review_required, not_evaluated
    en error vallen uit de noemer — zij tellen nooit als 1,0 mee. Naast de
    kwaliteitsscore rapporteert het resultaat een apart dekkingsblok
    (evaluation_coverage), zodat een lagere dekking niet als hogere
    kwaliteit kan verschijnen.

  weights:
    by_priority:
      high: 1.0
      medium: 0.8
      low: 0.5

    by_category:
      ARAI: 1.0
      CON: 1.0
      ESS: 1.0
      INT: 0.9
      SAM: 0.8
      STR: 0.7
      VER: 1.0
      DUP: 1.0

  # Score thresholds
  thresholds:
    excellent: 0.95
    good: 0.85
    acceptable: 0.75
    poor: 0.65
    failing: 0.50

  # Ignore baseline internal rules in scoring
  exclude_from_scoring:
    - "VAL-EMP-001"  # Empty check
    - "VAL-LEN-001"  # Min length
    - "VAL-LEN-002"  # Max length
    - "ESS-CONT-001"  # Context check
    - "CON-CIRC-001"  # Circularity
    - "STR-TERM-001"  # Term structure
    - "STR-ORG-001"   # Organization structure

# Validation execution settings
execution:
  parallel: false
  timeout_per_rule_ms: 500
  stop_on_critical: false
  max_retries: 0

  # Error handling
  error_handling:
    strategy: "continue"  # continue, stop, skip_category
    log_errors: true
    return_partial_results: true

# Rule caching
caching:
  enabled: true
  cache_rule_metadata: true
  cache_rule_instances: true
  ttl_seconds: 3600

# Rule validation on load
validation:
  validate_on_load: true
  checks:
    - "id_format"
    - "required_fields"
    # DEF-606: `python_class_exists` en `json_python_consistency` zijn
    # vervallen — er is nog maar één actief formaat, dus er valt geen
    # Pythonklasse te vinden en niets te synchroniseren. In plaats daarvan
    # wordt het runtime_contract per record afgedwongen
    # (toetsregels/runtime_contract.py, fail-closed bij laden).
    - "runtime_contract"

  # Rule ID format validation
  id_format:
    pattern: "^[A-Z]+-[0-9]{2}(SUB[0-9])?$"
    examples:
      - "ARAI-01"
      - "ARAI-02SUB1"
      - "CON-01"

# Generation hints configuration
generation_hints:
  enabled: true
  include_in_prompts: true
  max_hints_per_rule: 5

  # Hint templates
  templates:
    structure: "STRUCTUUR: {hint}"
    content: "INHOUD: {hint}"
    style: "STIJL: {hint}"
    avoid: "VERMIJD: {hint}"

# Rule dependencies
dependencies:
  track_dependencies: true
  validate_order: true

  # Known dependencies
  rules:
    "SAM-01":
      requires: []
      conflicts: []

    "DUP-01":
      requires:
        - "repository"  # Needs database access

# ASTRA compliance
astra:
  enabled: true
  track_compliance: true
  require_astra_links: false

  # ASTRA reference format
  reference_format: "https://astra.justis.nl/..."

# Reporting configuration
reporting:
  generate_reports: true
  report_format: "markdown"

  # What to include in reports
  include:
    - "rule_id"
    - "category"
    - "priority"
    - "result"
    - "score"
    - "message"
    - "reasoning"

# Testing configuration
testing:
  enable_test_mode: false
  test_data_path: "tests/fixtures/validation"

  # Test against baseline
  baseline:
    enabled: true
    definitions_count: 42
    definitions_file: "data/baseline/42_definitions.json"

# Environment-specific overrides
overrides:
  development:
    execution:
      parallel: false
      timeout_per_rule_ms: 1000
    validation:
      validate_on_load: true
    caching:
      ttl_seconds: 300  # 5 minutes in dev
    reporting:
      generate_reports: true

  production:
    execution:
      parallel: false  # Keep sequential for consistency
      timeout_per_rule_ms: 300
      stop_on_critical: false
    caching:
      ttl_seconds: 7200  # 2 hours in prod
    reporting:
      generate_reports: false  # Don't generate in prod

  testing:
    execution:
      timeout_per_rule_ms: 5000  # More time in tests
    caching:
      enabled: false  # Disable cache in tests
    testing:
      enable_test_mode: true
