repos:
  # Ruff - Fast Python linting
  # DEF-430/442: kept in sync with ruff== in requirements-dev.txt (the single
  # source the CI jobs install from). Bump both together — check_tool_pins (CI gate)
  # enforces it; re-verify scripts/complexity_baseline.txt on a bump.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: Ruff linting
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]

  # Black - Code formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Black formatting
        types: [python]

  # NOTE: isort removed - Ruff handles import sorting via [tool.ruff.lint.isort]
  # Having both caused import splitting conflicts (see DEF-173 analysis)

  # Gitleaks - Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        entry: gitleaks protect --verbose --redact --staged
        language: golang
        pass_filenames: false
        stages: [pre-commit]

  # Local custom hooks
  - repo: local
    hooks:
      - id: fix-requirements-frontmatter
        name: Normalize requirements frontmatter (policy)
        entry: python3 scripts/docs/fix_requirements_frontmatter.py
        language: system
        pass_filenames: false
        files: ^docs/backlog/requirements/REQ-.*\.md$
        stages: [pre-commit]
      - id: no-todo-markers
        name: Block TODO/FIXME markers in code
        entry: bash scripts/ci/check_no_todo_markers.sh
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: block-root-db-files
        name: Block root-level *.db files
        entry: bash scripts/ci/check_no_root_db_files.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest-smoke
        name: Run smoke tests (quick validation)
        entry: bash -c 'pytest -m smoke --tb=short --maxfail=1 -q || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: forbidden-patterns
        name: Check forbidden patterns (streamlit in services)
        # DEF-465: `|| true` blijft tot de hardcoded-key-check test-fixtures en
        # docstring-voorbeelden (sk-test/sk-ant-smoke/"sk-...") uitsluit — anders
        # blokkeert de hook op pure false positives. Zie DEF-465-comment.
        entry: bash -c 'bash scripts/ci/check-forbidden-patterns.sh || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: streamlit-anti-patterns
        name: Check Streamlit anti-patterns (DEF-56 lessons)
        entry: python3 scripts/check_streamlit_patterns.py
        language: system
        pass_filenames: false
        files: ^src/ui/.*\.py$
        stages: [pre-commit]
      - id: file-size-check
        name: Warn on large files (>500 LOC)
        entry: bash -c 'bash scripts/ci/check-file-size.sh || true'
        language: system
        types: [python]
        stages: [pre-commit]
      - id: validate-juridische-synoniemen
        name: Validate juridische_synoniemen.yaml
        entry: python3 scripts/validate_synonyms.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^config/juridische_synoniemen\.yaml$
        stages: [pre-commit]
      - id: check-namespace-collisions
        name: Check dependency-confusion (src/ vs requirements.txt) — DEF-409
        # language: python met additional_dependencies maakt de hook
        # zelfvoorzienend (DEF-411): de Python-rewrite (DEF-410) heeft `packaging`
        # nodig, maar de pre-commit-verify CI-job draait geen `pip install -r
        # requirements.txt`. Een geïsoleerde hook-venv garandeert `packaging`
        # ongeacht de ambient interpreter.
        entry: python scripts/ci/check_namespace_collisions.py
        language: python
        additional_dependencies: ["packaging"]
        pass_filenames: false
        # Triggert ook bij toevoeging van nieuwe src/<package>/__init__.py
        # zodat een nieuwe top-level die per ongeluk een PyPI-naam matcht
        # lokaal wordt gevangen, niet pas in CI.
        files: ^(requirements.*\.txt|src/[^/]+/__init__\.py)$
        stages: [pre-commit]
      - id: pip-audit
        name: pip-audit (CVE-scan dependencies) — DEF-426
        # Op pre-push (niet elke commit): pip-audit bevraagt de advisory-DB en is
        # traag. always_run zodat nieuwe CVE's ook zonder dependency-wijziging
        # gevangen worden. Self-contained via additional_dependencies.
        entry: pip-audit --requirement requirements.txt --desc
        language: python
        additional_dependencies: [pip-audit]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
