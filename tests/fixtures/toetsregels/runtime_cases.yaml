# DEF-503/DEF-606: runtime-matrix per toetsregel.
#
# Contract per rule-ID:
#   evaluator:        json_generiek | special_case | positieve_indicator
#   scoringstatus:    automatisch | niet_automatisch_toetsbaar |
#                     bewust_niet_scorend | defect_inert
#   required_fields:  velden waarop de failure branch steunt
#   positief/negatief/grens (bij automatisch): begrip, tekst,
#     optioneel categorie, verwacht_in_melding, verwacht (grens),
#     tekst_herhaal: {token, n} voor lengtecases
#   probe (bij niet-automatisch): sterkst denkbare poging de regel te
#     laten afgaan; de runner bewijst dat er dan géén violation komt.
#
# RED-bewijs stap 4 (2026-08-10): met SAM-06 als 'automatisch' faalde de
# runner exact zoals bedoeld — negatieve case gaf geen violation
# (vereist_param wordt door geen evaluator-tak gelezen) én de
# stil-genegeerd-check sloeg aan. Classificatie hieronder is de uitkomst.
# Tweede RED-vondst: VER-03 retourneert ná de lemma-check altijd pass,
# dus de herkenbaar_patronen van VER-03 zijn onbereikbaar (dood pad).

ARAI-03:
  required_fields: [herkenbaar_patronen]
  issue: DEF-624
  reden: >
    subjectieve bijvoeglijke naamwoorden zijn contextgebonden; het
    patroon mist de verbogen vorm in het eigen foute voorbeeld en zou
    bij verbreding op vrijwel elk bijvoeglijk naamwoord vuren.
  probe:
    begrip: maatregel
    tekst: "maatregel: ingreep die effectief bijdraagt"

VAL-LEN-001:
  required_fields: [min_words, min_chars]
  negatief:
    begrip: definitie
    tekst: "te kort"
    verwacht_in_melding: "Te weinig"
  positief:
    begrip: definitie
    tekst: "omschrijving met ruim voldoende woorden en voldoende tekens"
  grens:
    begrip: definitie
    tekst: "vijf woorden zijn precies genoeg"
    verwacht: geen_violation

VER-03:
  required_fields: []
  # DEF-621-fix: de twee dode én kwadratische patronen (".+t\b",
  # ".+d\b") zijn uit VER-03.json verwijderd — ze waren onbereikbaar
  # (de special-case retourneert altijd eerst) en zouden bij
  # heraansluiting elke tekst afkeuren. De special-case op het lemma
  # is de enige check.
  negatief:
    begrip: controleert
    tekst: "vorm van omgang binnen een organisatie"
    verwacht_in_melding: "infinitief"
  positief:
    begrip: controleren
    tekst: "vorm van omgang binnen een organisatie"
  grens:
    # Tekst met -t-woorden raakt VER-03 niet: alleen het lemma telt.
    begrip: controleren
    tekst: "vorm van omgang die men waardeert"
    verwacht: geen_violation

ESS-02:
  required_fields: []
  negatief:
    begrip: waarde
    tekst: "waarde zonder nadere duiding"
    verwacht_in_melding: "ontologische marker"
  positief:
    # Precies één categorie-hit (type: "klasse").
    begrip: waarde
    tekst: "klasse van waarderingsvormen"
  grens:
    # Twee categorieën (type "soort" + proces "handeling") -> ambigu.
    begrip: waarde
    tekst: "soort handeling binnen toezicht"
    verwacht: violation

SAM-06:
  issue: DEF-623
  required_fields: [vereist_param]
  reden: >
    voorkeurstermcontrole vereist het synoniemen-/voorkeurstermcontract;
    zonder die invoer is de uitkomst not_evaluated in plaats van een
    stille pass. Evaluator belegd bij DEF-623.
  probe:
    begrip: synoniemenpaar
    tekst: "aanduiding naast de voorkeursterm zonder consistent gebruik"

