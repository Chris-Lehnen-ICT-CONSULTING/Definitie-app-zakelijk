[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | cache
  | docs/archief
)/
'''

[tool.ruff]
# Same as Black
line-length = 88
target-version = "py313"

# Exclude similar to Black
extend-exclude = [
    "*.egg",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "cache",
    "docs/archief",
    "docs/ARCHIEF",
    "**/archief/**",
    "**/ARCHIEF/**",
    "**/archive/**",
    "**/*archive*/**",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E402",   # Module level import not at top of file - we'll fix these manually
    "E501",   # Line too long - handled by Black
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PGH003",  # Use specific rule codes when ignoring type issues
    "PLC0415", # Import outside top-level - intentional lazy loading
    "ARG002",  # Unused method argument - often needed for interface compliance
    "ARG001",  # Unused function argument - often needed for interface compliance
    "N999",    # Invalid module name - legacy naming conventions
    "PLW0603", # Global statement - used for singleton patterns
    "PLW0127", # Self-assignment (UTC = UTC) - Python 3.10 compatibility pattern
    "PLW2901", # Loop variable overwritten - intentional in many cases
    "PLW0108", # Unnecessary lambda - DEF-430: surfaced by ruff 0.15.x (10 hits,
    #            9 in validation rule tables); only --unsafe-fixes available, so
    #            inlining is behaviour-risky in validation code. Intentional style.
    "PLC2401", # Non-ASCII characters in names - Dutch variable names allowed
    "PLR0911", # Too many return statements - complex validation logic
    "PLR0912", # Too many branches - complex validation logic
    "PLR0915", # Too many statements - complex validation logic
    "RUF001",  # Ambiguous Unicode characters - intentional emoji usage in UI
    "RUF002",  # Ambiguous Unicode in docstrings - intentional (× for dimensions)
    "RUF003",  # Ambiguous Unicode in comments - intentional (× for dimensions)
    "RUF012",  # Mutable class attributes - intentional patterns
    "RUF059",  # Unused unpacked variable - acceptable in UI layouts
    "SIM102",  # Nested if statements - often more readable
    "DTZ",     # Datetime timezone rules - acceptable patterns
    "EM",      # Exception message rules - acceptable for context
    "RUF005",  # Collection literal concatenation - often intentional
    "ARG003",  # Unused class method argument - often needed
    "ARG004",  # Unused static method argument - often needed
    "ARG005",  # Unused lambda argument - often required
    "SIM105",  # Use contextlib.suppress - try/except often more explicit
    "SIM113",  # Use enumerate - explicit counter sometimes clearer
    "B005",    # Using .strip() with multi-character - intentional
    "B018",    # Useless expression - sometimes used for type checking
    "B019",    # lru_cache on methods - acceptable pattern
    "N802",    # Function name lowercase - exceptions for special methods
    "N806",    # Variable lowercase - constants acceptable
    "N814",    # Camelcase imports - external APIs
    "UP047",   # PEP 695 generic functions - aparte migratie, niet forceren bij py313-bump (DEF-426)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ignore imports in __init__ files
"__init__.py" = ["F401", "E402"]
# Ignore common patterns in test files
"test_*.py" = ["F401", "E402", "PT017", "PT018", "PT028", "PT030", "B023", "PLW1641", "N811"]
"*_test.py" = ["F401", "E402", "PT017", "PT018", "PT028", "PT030", "B023", "PLW1641", "N811"]
"tests/**/*.py" = ["PT017", "PT018", "PT028", "PT030", "B023", "PLW1641", "N811"]
# Manual test files - more relaxed standards
"tests/manual_*.py" = ["SIM115", "F401"]
# DEF-418: removed 6 dead complexity per-file-ignores (PLR0912/0915/PLC0415/PLW0603
# are already in the global ignore, so these were redundant). The complexity ratchet
# (scripts/complexity_ratchet.py) now tracks these files too.
# Analysis scripts may have unused arguments
"src/analysis/*.py" = ["ARG001"]
# Ignore ALL errors in archief/archive directories
"**/archief/**/*.py" = ["ALL"]
"**/ARCHIEF/**/*.py" = ["ALL"]
"**/archive/**/*.py" = ["ALL"]
"docs/architectuur/definitie service/archief/**/*.py" = ["ALL"]
# Documentation/example files - may have incomplete code
"docs/implementation/*.py" = ["F821", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Unix-style line endings
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
# DEF-439: src-layout import-resolutie. Zonder deze twee settings resolven
# `from database.* import X` / `from services.* import X` naar Any (mypy vindt het
# package niet onder src/ en ignore_missing_imports maakt het stilzwijgend Any).
# Met mypy_path=src + explicit_package_bases resolven ze echt → reële type-checks.
# Neveneffect: module-namen in [[tool.mypy.overrides]] verliezen de `src.`-prefix.
mypy_path = "src"
explicit_package_bases = true
# DEF-431 Fase 2: globaal getypeerde signatures afdwingen. Legacy-modules zijn
# vrijgesteld via de [[tool.mypy.overrides]] onderaan (de krimpende debt-teller).
# check_untyped_defs staat globaal aan sinds DEF-438 (de 6 src/services-errors
# die dit blootlegde zijn daar gefixt); de zero-tolerance `mypy src/services`-gate
# blijft daardoor groen.
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "per-categorie",
    "per-context",
    "per-prioriteit",
    "UNKNOWN.egg-info",
]


# DEF-431 Fase 2 — legacy-modules met ontbrekende annotaties (no-untyped-def).
# disallow_untyped_defs is hier (tijdelijk) uit; deze lijst IS de debt-teller en
# krimpt per package-PR (bewaakt door scripts/mypy_overrides_ratchet.py, baseline 145).
# Nieuwe/gewijzigde code BUITEN deze lijst moet getypeerd zijn (globaal disallow=true).
[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = [
    # DEF-437 batch 4c: laatste KRITIEKE override; ~13 errors te annoteren.
    "voorbeelden.robust_cache",
    "voorbeelden.unified_voorbeelden",
]

# DEF-420: centrale coverage-config (was nergens gedefinieerd; verspreide ini-keys
# verwijderd). source=src matcht de gate `--cov=src`. omit/exclude_lines halen
# niet-meetbare regels uit de noemer → eerlijke meting; gate-vloer ongewijzigd (45%).
[tool.coverage.run]
source = ["src"]
branch = false
# Bewust GEEN blanket-omit van migrations: dat zijn Python-modules met inline SQL
# (database/migrations/v{N}_migration.py) die testbare logica kunnen bevatten —
# uit de noemer halen zou een meetgat verbergen i.p.v. dichten. (__pycache__ is
# sowieso een no-op voor coverage.)
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
