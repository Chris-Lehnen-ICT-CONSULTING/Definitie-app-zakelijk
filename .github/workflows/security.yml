name: Security

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # DEF-522: de grenzen komen uit de event-payload en gaan uitsluitend via de
      # omgeving naar de gate; nooit als expressie in een shellregel.
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SECRET_SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # DEF-463: pin gelijk aan .pre-commit-config.yaml en .gitleaks.toml.
      GITLEAKS_VERSION: 8.29.1
      # De runner-context is hier niet beschikbaar: op job-env laat een
      # ${{ runner.* }}-expressie de hele workflow afwijzen, waarna de run nul
      # jobs krijgt en deze verplichte gate stil niet draait. De paden buiten de
      # werkmap staan daarom op de env van de stap die ze gebruikt.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Volledige historie; de gate scant ook de canonieke refs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Install gitleaks
        env:
          # Buiten de werkmap, zodat archief en binary niet in de scanscope van
          # de werkboomscan belanden.
          GITLEAKS_DIR: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$GITLEAKS_DIR"
          cd "$GITLEAKS_DIR"
          archief="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archief}"
          tar -xzf "$archief"
          chmod +x gitleaks

      - name: Canary- en gatetests (verplicht, geen skip)
        env:
          # De verplicht aangewezen binary en fixture-root; beide buiten de
          # werkmap, zodat het testmateriaal niet meegescand wordt.
          DEF522_GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
          DEF522_FIXTURE_ROOT: ${{ runner.temp }}/def522-fixtures
        run: |
          set -euo pipefail
          mkdir -p "$DEF522_FIXTURE_ROOT"
          make test-secret-scan

      - name: Fail-closed secret-gate (range, canonieke historie, werkboom)
        env:
          # Dezelfde binary buiten de werkmap als hierboven geinstalleerd.
          SECRET_SCAN_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
        run: make secret-scan

  deps-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (strict)
        run: |
          # Audit direct and transitive deps; fail on vulnerabilities
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --strict; fi
          if [ -f requirements-dev.txt ]; then pip-audit -r requirements-dev.txt --strict; fi

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (hele repo, één scan → JSON)
        # Eén scan over de hele repo met p/owasp-top-ten + p/python.
        # Bewust GEEN '--error' en GEEN '|| true': findings laten deze stap niet
        # falen (de gate hieronder beslist), maar config-/scanfouten (exit 2)
        # falen wél hard — geen schijnzekerheid door een gemaskeerde fout.
        run: |
          semgrep scan --config p/owasp-top-ten --config p/python \
            --metrics=off --json --output=semgrep-results.json

      - name: Rapporteer alle findings (advisory)
        # Volledige zichtbaarheid van álle findings (alle paden, alle severities),
        # incl. de pre-existing ERRORs in .github/workflows/ — zonder te blokkeren.
        run: |
          python - <<'PY'
          import collections
          import json

          with open("semgrep-results.json") as fh:
              data = json.load(fh)

          results = data.get("results", [])
          by_severity = collections.Counter(
              r.get("extra", {}).get("severity") for r in results
          )
          print(f"Semgrep findings (hele repo): {len(results)} — {dict(by_severity)}")
          for r in results:
              sev = r.get("extra", {}).get("severity")
              rule = r.get("check_id", "").split(".")[-1]
              line = r.get("start", {}).get("line")
              print(f"  [{sev}] {r.get('path')}:{line} {rule}")

          errors = data.get("errors", [])
          fatal = [e for e in errors if e.get("level") == "error"]
          print(f"Scan-fouten: {len(errors)} (waarvan fataal: {len(fatal)})")
          PY

      - name: Gate — blokkeer op ERROR-severity in src/
        # Blokkeert alleen op ERROR-findings in applicatiecode (src/). Pre-existing
        # ERRORs in CI-workflows (.github/) en alle WARNINGs blijven advisory.
        # Verbreden van de gate-scope + triage van die findings: ALG-214 follow-up.
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep-results.json") as fh:
              data = json.load(fh)

          # Fail-closed: een onbetrouwbare scan mag niet stil doorlaten. Alleen
          # FATALE fouten (level == "error") tellen; level == "warn" (bv.
          # PartialParsing van losse docs/scripts) is niet-fataal en is geen reden
          # om te falen.
          fatal = [e for e in data.get("errors", []) if e.get("level") == "error"]
          if fatal:
              print(f"::error::Semgrep had {len(fatal)} fatale scan-fout(en) — gate faalt (fail-closed).")
              for e in fatal:
                  print(f"  - {str(e.get('message'))[:200]}")
              sys.exit(1)

          def in_src(path):
              if path.startswith("./"):
                  path = path[2:]
              return path.startswith("src/")

          blocking = [
              r for r in data.get("results", [])
              if r.get("extra", {}).get("severity") == "ERROR"
              and in_src(r.get("path", ""))
          ]
          for r in blocking:
              line = r.get("start", {}).get("line")
              print(f"::error file={r.get('path')},line={line}::{r.get('check_id')}")
          print(f"ERROR-severity findings in src/: {len(blocking)}")
          sys.exit(1 if blocking else 0)
          PY

