name: Security

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full git history for gitleaks diff scanning

      - name: Install gitleaks
        run: |
          # Install gitleaks CLI (no license required for CLI)
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.25.0/gitleaks_8.25.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.25.0_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run gitleaks
        run: |
          ./gitleaks detect --redact --verbose --exit-code 1

  deps-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (strict)
        run: |
          # Audit direct and transitive deps; fail on vulnerabilities
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --strict; fi
          if [ -f requirements-dev.txt ]; then pip-audit -r requirements-dev.txt --strict; fi

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (hele repo, één scan → JSON)
        # Eén scan over de hele repo met p/owasp-top-ten + p/python.
        # Bewust GEEN '--error' en GEEN '|| true': findings laten deze stap niet
        # falen (de gate hieronder beslist), maar config-/scanfouten (exit 2)
        # falen wél hard — geen schijnzekerheid door een gemaskeerde fout.
        run: |
          semgrep scan --config p/owasp-top-ten --config p/python \
            --metrics=off --json --output=semgrep-results.json

      - name: Rapporteer alle findings (advisory)
        # Volledige zichtbaarheid van álle findings (alle paden, alle severities),
        # incl. de pre-existing ERRORs in .github/workflows/ — zonder te blokkeren.
        run: |
          python - <<'PY'
          import collections
          import json

          data = json.load(open("semgrep-results.json"))
          results = data.get("results", [])
          by_severity = collections.Counter(
              r["extra"].get("severity") for r in results
          )
          print(f"Semgrep findings (hele repo): {len(results)} — {dict(by_severity)}")
          for r in results:
              sev = r["extra"].get("severity")
              rule = r["check_id"].split(".")[-1]
              print(f"  [{sev}] {r['path']}:{r['start']['line']} {rule}")
          PY

      - name: Gate — blokkeer op ERROR-severity in src/
        # Blokkeert alleen op ERROR-findings in applicatiecode (src/). Pre-existing
        # ERRORs in CI-workflows (.github/) en alle WARNINGs blijven advisory.
        # Verbreden van de gate-scope + triage van die findings: ALG-214 follow-up.
        run: |
          python - <<'PY'
          import json
          import sys

          data = json.load(open("semgrep-results.json"))
          blocking = [
              r for r in data.get("results", [])
              if r["extra"].get("severity") == "ERROR"
              and r["path"].startswith("src/")
          ]
          for r in blocking:
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']}")
          print(f"ERROR-severity findings in src/: {len(blocking)}")
          sys.exit(1 if blocking else 0)
          PY

