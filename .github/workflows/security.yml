name: Security

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # DEF-522: de grenzen komen uit de event-payload en gaan uitsluitend via de
      # omgeving naar de gate; nooit als expressie in een shellregel.
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SECRET_SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # DEF-741: een push die een branch aanmaakt meldt geen voorganger —
      # github.event.before is dan de nulbase, die als grens niet bestaat.
      # Uitsluitend dat geval krijgt de volledige-historiemodus; elke andere
      # push en elke PR houdt `full`. De keuze reist alleen via de omgeving naar
      # Make en komt nergens in een shellregel terecht.
      SECRET_SCAN_MODE: >-
        ${{ (github.event_name == 'push' && github.event.created == true &&
        github.event.deleted == false &&
        startsWith(github.ref, 'refs/heads/') &&
        github.event.before == '0000000000000000000000000000000000000000')
        && 'new-branch' || 'full' }}
      # DEF-463: pin gelijk aan .pre-commit-config.yaml en .gitleaks.toml.
      GITLEAKS_VERSION: 8.29.1
      # De runner-context is hier niet beschikbaar: op job-env laat een
      # ${{ runner.* }}-expressie de hele workflow afwijzen, waarna de run nul
      # jobs krijgt en deze verplichte gate stil niet draait. De paden buiten de
      # werkmap staan daarom op de env van de stap die ze gebruikt.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Volledige historie; de gate scant ook de canonieke refs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Install gitleaks
        env:
          # Buiten de werkmap, zodat archief en binary niet in de scanscope van
          # de werkboomscan belanden.
          GITLEAKS_DIR: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$GITLEAKS_DIR"
          cd "$GITLEAKS_DIR"
          archief="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archief}"
          tar -xzf "$archief"
          chmod +x gitleaks

      - name: Canary- en gatetests (verplicht, geen skip)
        env:
          # De verplicht aangewezen binary en fixture-root; beide buiten de
          # werkmap, zodat het testmateriaal niet meegescand wordt.
          DEF522_GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
          DEF522_FIXTURE_ROOT: ${{ runner.temp }}/def522-fixtures
        run: |
          set -euo pipefail
          mkdir -p "$DEF522_FIXTURE_ROOT"
          make test-secret-scan

      - name: Fail-closed secret-gate (range, canonieke historie, werkboom)
        env:
          # Dezelfde binary buiten de werkmap als hierboven geinstalleerd.
          SECRET_SCAN_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
        run: make secret-scan

  deps-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (strict)
        run: |
          # Audit direct and transitive deps; fail on vulnerabilities
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --strict; fi
          if [ -f requirements-dev.txt ]; then pip-audit -r requirements-dev.txt --strict; fi

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # DEF-665: scan, rapportage en gate lopen via één gedeeld entrypoint, dat
      # Make en CI allebei aanroepen. Dezelfde configuraties (p/owasp-top-ten +
      # p/python) en hetzelfde bereik (de hele repo), maar het rapport komt uit
      # stdout in plaats van uit een bestand, en een onbetrouwbare scan — lege
      # of ontbrekende velden, geen gescande paden, of scanfouten — is nu een
      # eigen nonzero status in plaats van stil groen. Bewust nog steeds geen
      # '--error': de gate beslist zelf welke findings blokkeren.
      - name: Semgrep-gate (make semgrep-check, blokkerend)
        run: make semgrep-check

