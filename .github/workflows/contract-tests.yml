name: Contract Tests

# Draait op ELKE PR — geen paths-filter.
# Reden: "Validation Contract Tests" is een REQUIRED status check. Met een
# paths-filter bleef de check ongetriggerd op PRs die de gefilterde paden niet
# raken (bv. dependency-bumps in requirements.txt), waardoor de merge permanent
# BLOCKED was op een nooit-gerapporteerde required check. De vroegere
# self-trigger-hack (PR #193/#199/#200: een comment-edit op dit bestand) is
# hiermee overbodig. Een dependency-bump kán contracten breken, dus validatie
# op elke PR is inhoudelijk juist.
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/story-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    name: Validation Contract Tests

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio jsonschema pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run contract gate (make test-contract)
      id: contract-gate
      env:
        # Provide dummy API keys to satisfy clients; tests only verify structure.
        # Default-provider = anthropic → ANTHROPIC_API_KEY vereist voor client-bouw.
        # De gate zet deze waarden zelf ook nog eens vóór elke import.
        ANTHROPIC_API_KEY: dummy
        OPENAI_API_KEY: dummy
        OPENAI_API_KEY_PROD: dummy
      run: |
        # DEF-519: precies één testaanroep. De oude `|| python -m pytest ...`
        # fallback draaide bij elke rode contractrun een tweede, bredere
        # selectie zonder markerfilter; een echte contractfout kon zo door de
        # tweede aanroep worden overschreven. De gate loopt nu via dezelfde
        # bewaakte runner als de hoofdgates: offline-bootstrap vóór elke import,
        # lege selectie/collectiefout/toolfout/timeout elk nonzero.
        # De scope is de `contract`-marker (dus ook contractnodes buiten
        # tests/integration/contracts); diezelfde nodes blijven daarnaast deel
        # van de integrationunie in test.yml.
        make test-contract

    - name: Validate validation_result.schema.json
      run: |
        python - << 'PY'
        import json, sys
        from jsonschema import Draft202012Validator
        from pathlib import Path

        # Check main schema file
        p = Path('docs/architectuur/contracts/schemas/validation_result.schema.json')
        if not p.exists():
            print(f"Schema file not found: {p}", file=sys.stderr)
            sys.exit(1)

        with p.open() as f:
            schema = json.load(f)

        try:
            Draft202012Validator.check_schema(schema)
            print(f"✓ {p.name} is a valid JSON Schema")
        except Exception as e:
            print(f"✗ Schema validation failed: {e}", file=sys.stderr)
            sys.exit(1)

        # Also check versioned schema if it exists
        v_path = Path('docs/architectuur/contracts/schemas/validation_result_v1.0.0.schema.json')
        if v_path.exists():
            with v_path.open() as f:
                v_schema = json.load(f)
            Draft202012Validator.check_schema(v_schema)
            print(f"✓ {v_path.name} is also valid")
        PY

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: contract-test-results
        path: |
          reports/gates/
        retention-days: 30

    - name: Comment test results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v9
      with:
        script: |
          // DEF-519: het bestaan van een rapportbestand was geen uitkomst. De
          // comment leest nu de werkelijke stapuitkomst plus de getelde
          // resultaten uit het JUnit-rapport van de gate.
          const fs = require('fs');
          const uitkomst = '${{ steps.contract-gate.outcome }}';
          const junit = 'reports/gates/contract-junit.xml';
          let details = 'Geen JUnit-rapport gevonden — de gate is niet tot uitvoeren gekomen.';
          if (fs.existsSync(junit)) {
            const xml = fs.readFileSync(junit, 'utf8');
            // Dit is een YAML-blokscalar: backslashes komen letterlijk in de JS
            // terecht. `\\d` in de template-literal wordt dus de string `\d`
            // en pas daarmee ziet RegExp een cijferklasse. Met vier
            // backslashes zocht de comment naar de letterlijke tekst `\d+` en
            // telde altijd nul.
            const attr = (naam) => {
              const treffer = xml.match(new RegExp(`${naam}="(\\d+)"`));
              return treffer ? Number(treffer[1]) : null;
            };
            const toon = (naam) => {
              const waarde = attr(naam);
              return `${naam}=${waarde === null ? 'onbekend' : waarde}`;
            };
            details = attr('tests') === null
              ? 'JUnit-rapport aanwezig maar zonder telbare testsuite-attributen.'
              : ['tests', 'failures', 'errors', 'skipped'].map(toon).join(' ');
          }
          const kop = uitkomst === 'success'
            ? '✅ Validation Contract Tests geslaagd'
            : `❌ Validation Contract Tests ${uitkomst}`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${kop}\n\n${details}\n\nArtefacten: contract-test-results.`
          });
