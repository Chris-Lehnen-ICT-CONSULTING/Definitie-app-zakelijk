name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # DEF-665: dezelfde poort als lokaal. De handhavingsvlag staat in het
      # Make-target, zodat er geen tweede contract naast de Makefile ontstaat.
      - name: Grep Gate (make grep-check, blokkerend)
        run: make grep-check

      - name: Toolgate-tests (make test-tool-gates, blokkerend)
        run: make test-tool-gates

      # DEF-519: hier stond een eigen pytest-subset met `--cov=src`. pytest-cov
      # schrijft dan `.coverage.*` in de checkout, wat de vroege
      # offline-bootstrap terecht weigert (PR #427: INTERNALERROR), en het was
      # een tweede selectie naast de Makefile. Deze required job draait nu
      # dezelfde bewaakte gate als `make`: één poort, volledige
      # acceptance/smoke-scope, eigen sessieroot en eigen artefactpaden, elke
      # fout met een eigen nonzero status. De unitcoverage-ratchet (45%) blijft
      # in `test.yml`; hier wordt geen tweede coveragemeting opgetuigd.
      - name: Acceptance/smoke gate (make test-acceptance, blokkerend)
        run: make test-acceptance

      - name: Archive acceptance gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-gate-results
          path: |
            reports/gates/
