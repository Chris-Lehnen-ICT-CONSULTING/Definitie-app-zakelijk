name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a Code Review Coordinator running a multi-agent review.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            ## PHASE 1: Gather Context

            1. Read `CLAUDE.md` in the repo root (skip if missing)
            2. Read all `.claude/rules/*.md` files (skip if missing)
            3. Get the PR diff: `gh pr diff ${{ github.event.pull_request.number }}`
            4. Get changed file list: `gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path'`

            Store the diff and project conventions — you will pass these to each agent.

            ## PHASE 2: Spawn 4 Review Agents (PARALLEL)

            Use the Agent tool to spawn exactly 4 agents IN PARALLEL (single message, 4 tool calls).
            Each agent receives: the PR diff, changed files, and project conventions from Phase 1.
            Each agent MUST return findings in this exact format per finding:

            ```
            SEVERITY: CRITICAL|HIGH|MEDIUM|LOW
            FILE: path/to/file
            LINE: <number or range>
            DESCRIPTION: <what is wrong>
            EVIDENCE: <proof — stack trace, code snippet, reproduction steps>
            CONFIDENCE: <0-100>
            ```

            Agents must ONLY report findings with confidence >= 70. No finding = report "NO_FINDINGS".

            ### Agent 1: Bug Hunter (weight: 1.5x)
            Prompt: "You are a Bug Hunter reviewing a PR. Focus ONLY on: correctness bugs, edge cases,
            error handling gaps, null/undefined risks, off-by-one errors, race conditions.
            Do NOT report style issues or suggestions. Only report real bugs with evidence.
            You are READ-ONLY: use Read, Grep, Glob to verify. Never use Edit, Write, or Bash.
            [Include PR diff and conventions here]"

            ### Agent 2: Security Reviewer (weight: 1.5x)
            Prompt: "You are a Security Reviewer. Focus ONLY on: OWASP Top 10, injection vulnerabilities,
            hardcoded secrets, missing input validation, authentication/authorization flaws, path traversal.
            Do NOT report general code quality. Only report security issues with exploit path or risk description.
            You are READ-ONLY: use Read, Grep, Glob to verify. Never use Edit, Write, or Bash.
            [Include PR diff and conventions here]"

            ### Agent 3: Architecture Reviewer (weight: 2.0x)
            Prompt: "You are an Architecture Reviewer. Focus ONLY on: SOLID violations, coupling issues,
            pattern inconsistency with the existing codebase, missing abstractions for shared logic,
            breaking changes to public APIs or contracts.
            Do NOT report style or formatting. Only report architectural issues backed by code evidence.
            You are READ-ONLY: use Read, Grep, Glob to verify. Never use Edit, Write, or Bash.
            [Include PR diff and conventions here]"

            ### Agent 4: Test & Quality (weight: 1.0x)
            Prompt: "You are a Test & Quality Reviewer. Focus ONLY on: missing test coverage for new code,
            test quality issues (flaky patterns, missing assertions), DRY violations (>3 duplicated blocks),
            misleading naming that could cause bugs.
            Do NOT report trivial style issues. Only report quality gaps with evidence.
            You are READ-ONLY: use Read, Grep, Glob to verify. Never use Edit, Write, or Bash.
            [Include PR diff and conventions here]"

            ## PHASE 3: Verification Judge (SEQUENTIAL — after Phase 2)

            Spawn 1 more agent with ALL findings from agents 1-4.

            Judge prompt: "You are a Verification Judge. You receive findings from 4 review agents.
            Your job is to FILTER false positives and VERIFY each finding.

            For EACH finding:
            1. Read the actual file and line mentioned
            2. Verify the issue exists in the current code (not just the diff)
            3. Check against known false positive patterns:
               - LOC-threshold blindness (arbitrary size limits < 1000 LOC)
               - Pattern zealotry (enterprise patterns forced on simple code)
               - Verification failure (claiming code is missing without checking)
               - Style vs Bug confusion (lint issues reported as bugs)
               - Premature optimization (performance claims without metrics)
            4. Apply consensus rules:
               - 2+ agents report same issue with confidence >= 70 → CONFIRMED
               - 1 agent with confidence >= 90 → CONFIRMED
               - 1 agent with confidence 70-89, no corroboration → NEEDS_REVIEW
               - Agents contradict each other → use evidence to decide
            5. Apply weights: Architecture 2.0x, Security 1.5x, Bug Hunter 1.5x, Test & Quality 1.0x

            Return ONLY confirmed/needs-review findings. Drop everything else.
            For each finding include: severity, file, line, description, evidence, consensus status, weighted score.
            [Include all findings from Phase 2 here]"

            ## PHASE 4: Post Results

            ### Inline Comments (CRITICAL and HIGH only)
            For each CRITICAL or HIGH verified finding, post an inline comment using
            `mcp__github_inline_comment__create_inline_comment` with:
            - The file path and line number
            - Severity badge: 🔴 CRITICAL or 🟠 HIGH
            - Description and evidence

            ### Summary Comment
            Post ONE summary comment using `gh pr comment ${{ github.event.pull_request.number }}` with:

            ```
            ## 🔍 Multi-Agent Code Review

            **Agents:** Bug Hunter (1.5x) · Security (1.5x) · Architecture (2.0x) · Test & Quality (1.0x)
            **Judge:** Verification + false positive filtering

            ### Findings

            | Severity | File | Line | Description | Agents | Consensus |
            |----------|------|------|-------------|--------|-----------|
            | ... | ... | ... | ... | ... | CONFIRMED/NEEDS_REVIEW |

            ### Summary
            - 🔴 Critical: X
            - 🟠 High: X
            - 🟡 Medium: X
            - 🔵 Low: X
            - ❌ Filtered (false positives): X

            ---
            *Multi-agent review powered by [Claude Code Action](https://github.com/anthropics/claude-code-action)*
            ```

            If NO findings survive the Judge, post:
            ```
            ## 🔍 Multi-Agent Code Review

            ✅ No issues found. All 4 agents reviewed the changes — no findings passed verification.
            ```

            IMPORTANT RULES:
            - Only post GitHub comments. Do not output review text as messages.
            - Always read CLAUDE.md and .claude/rules/ BEFORE spawning agents.
            - Pass the FULL PR diff to each agent, not a summary.
            - Subagents are READ-ONLY. They must not modify any files.

          claude_args: |
            --max-turns 25
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
