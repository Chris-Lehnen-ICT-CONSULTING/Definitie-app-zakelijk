name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            You are a Code Review Coordinator running a multi-agent review.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            ## PHASE 1: Gather Context

            1. Read `CLAUDE.md` in the repo root (skip if missing)
            2. Read all `.claude/rules/*.md` files (skip if missing)
            3. Get the PR diff: `gh pr diff ${{ github.event.pull_request.number }}`
            4. Get changed file list: `gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path'`

            5. Check diff size: `gh pr diff ${{ github.event.pull_request.number }} --stat | tail -1`
               The last line looks like: "X files changed, Y insertions(+), Z deletions(-)".
               Sum the insertions and deletions numbers to get DIFF_LOC.
               If the parse fails or output is empty, set DIFF_LOC = 0 and continue.
               - If DIFF_LOC > 400: set LARGE_DIFF = true. Add warning to summary.
               Pass the DIFF_LOC value to the Judge.

            6. Check for spec-protocol: scan the PR body for a linked issue (patterns like ALG-XX, PRO-XX, DEF-XX, ADH-XX, AIK-XX).
               If no issue link is found, set MISSING_SPEC = true.
               This is informational only — the review proceeds regardless.

            Store the diff, project conventions, diff size, and spec status — you will pass these to each agent.

            ## PHASE 2: Spawn Review Agents (PARALLEL)

            First, check the changed files list from Phase 1 for .tsx or .jsx files.
            - If .tsx/.jsx files are present: spawn agents 1, 2, 3, 4, AND 4b — all 5 IN PARALLEL (single message, 5 tool calls).
            - If NO .tsx/.jsx files: spawn agents 1, 2, 3, 4 — all 4 IN PARALLEL (single message, 4 tool calls).
            Each agent receives: the PR diff, changed files, and project conventions from Phase 1.
            IMPORTANT: Include the FULL content of `.claude/rules/review-guidelines.md` (read in Phase 1)
            directly in each agent's prompt as a [REVIEW GUIDELINES] block. Do NOT instruct agents to
            read it themselves — this saves tool calls and guarantees the guidelines are in context.
            Each agent MUST return findings in this exact format per finding:

            ```
            SEVERITY: CRITICAL|HIGH|MEDIUM|LOW
            FILE: path/to/file
            LINE: <number or range>
            DESCRIPTION: <what is wrong>
            EVIDENCE: <proof — stack trace, code snippet, reproduction steps>
            CONFIDENCE: <0-100>
            ```

            Agents must ONLY report findings with confidence >= 70. No finding = report "NO_FINDINGS".

            ### Agent 1: Bug Hunter (weight: 1.5x)
            Prompt: "You are a Bug Hunter reviewing a PR. Focus ONLY on: correctness bugs, edge cases,
            error handling gaps, null/undefined risks, off-by-one errors, race conditions.
            Do NOT report style issues or suggestions. Only report real bugs with evidence.
            TOOL RESTRICTION: You have access to Read, Grep, and Glob ONLY. Do NOT use Bash, Edit, or Write under any circumstances. Findings produced using disallowed tools will be invalidated.
            [Include: PR diff, changed files, project conventions, and review-guidelines.md content]"

            ### Agent 2: Security Reviewer (weight: 1.5x)
            Prompt: "You are a Security Reviewer. Focus ONLY on: OWASP Top 10, injection vulnerabilities,
            hardcoded secrets, missing input validation, authentication/authorization flaws, path traversal.
            Do NOT report general code quality. Only report security issues with exploit path or risk description.
            TOOL RESTRICTION: You have access to Read, Grep, and Glob ONLY. Do NOT use Bash, Edit, or Write under any circumstances. Findings produced using disallowed tools will be invalidated.
            [Include: PR diff, changed files, project conventions, and review-guidelines.md content]"

            ### Agent 3: Architecture Reviewer (weight: 2.0x)
            Prompt: "You are an Architecture Reviewer. Focus ONLY on: SOLID violations, coupling issues,
            pattern inconsistency with the existing codebase, missing abstractions for shared logic,
            breaking changes to public APIs or contracts.

            CROSS-FILE DEPENDENCY CHECK (mandatory for each changed file):
            1. For each changed file, use Grep to find all files that import from it
            2. Check if any exported function, class, or type signatures changed
            3. If exports changed: verify all importers still work with the new signature
            4. Flag any breaking change as CRITICAL with the list of affected importing files
            Only flag if actual signatures changed — internal refactors that preserve exports are fine.

            Do NOT report style or formatting. Only report architectural issues backed by code evidence.
            TOOL RESTRICTION: You have access to Read, Grep, and Glob ONLY. Do NOT use Bash, Edit, or Write under any circumstances. Findings produced using disallowed tools will be invalidated.
            [Include: PR diff, changed files, project conventions, and review-guidelines.md content]"

            ### Agent 4: Test & Quality (weight: 1.0x)
            Prompt: "You are a Test & Quality Reviewer. Focus ONLY on: missing test coverage for new code,
            test quality issues (flaky patterns, missing assertions), DRY violations (>3 duplicated blocks),
            misleading naming that could cause bugs.
            Do NOT report trivial style issues. Only report quality gaps with evidence.
            TOOL RESTRICTION: You have access to Read, Grep, and Glob ONLY. Do NOT use Bash, Edit, or Write under any circumstances. Findings produced using disallowed tools will be invalidated.
            [Include: PR diff, changed files, project conventions, and review-guidelines.md content]"

            ### Agent 4b: Frontend Quality (only spawned if .tsx/.jsx files in diff)
            Prompt: "You are a Frontend Quality Reviewer for React/TypeScript code.
            Run these 8 binary checks on the changed .tsx/.jsx files. Report PASS or FAIL per check.

            1. ErrorBoundary: Components that could throw have an ErrorBoundary wrapper
            2. No any type: Zero usage of `: any`, `as any`, `any[]`, or `<any>` in TypeScript
            3. TanStack Query: Data fetching uses TanStack Query, not raw useState + useEffect + fetch
            4. Zod validation: External data (API responses, form input) is validated with Zod schemas
            5. Stable keys: List renderings use stable, unique keys (not array index)
            6. Memoization: Expensive computations and callback props use useCallback/useMemo
            7. Accessibility: Interactive elements have aria labels and keyboard handlers
            8. No inline styles: Styles use CSS modules, Tailwind, or styled-components (not style={{}})

            Format per check: CHECK: [name] | RESULT: PASS/FAIL | FILE: path | LINE: number | EVIDENCE: snippet
            Only check files in the PR diff, not the entire codebase.
            TOOL RESTRICTION: You have access to Read, Grep, and Glob ONLY. Do NOT use Bash, Edit, or Write under any circumstances. Findings produced using disallowed tools will be invalidated.
            [Include: PR diff, changed files, project conventions, and review-guidelines.md content]"

            ## PHASE 3: Verification Judge (SEQUENTIAL — after Phase 2)

            Spawn 1 more agent with ALL findings from agents 1-4 (and 4b if spawned).

            Judge prompt: "You are a Verification Judge. You receive findings from the review agents (4 or 5, depending on whether Agent 4b was spawned).
            Your job is to FILTER false positives and VERIFY each finding.
            If an agent returned NO_FINDINGS, that means zero findings from that agent — do not penalize or skip its weight in consensus calculations.

            ## STEP 0: Independent Verification (MANDATORY for each finding)

            Before applying any rule, YOU MUST independently verify each finding:
            1. Use Read to open the exact file cited in the finding
            2. Go to the specific line number and read at least 20 lines of surrounding context
            3. Determine whether the reported issue actually exists in the current code
            If the file or line does not exist, or the code does not match the claim → REJECT immediately.
            Do NOT trust agent claims at face value — verify with your own eyes.

            ## HARD REJECTION RULES (from verified skill protocols)

            Apply these 5 rules to EVERY finding. If a finding fails ANY rule, REJECT it
            and log the rejection reason.

            RULE 1 — Evidence Required (source: verification-before-completion)
            Reject if the agent provides no grep/read output proving the issue exists.
            A finding that says 'this could fail' without showing the actual code path = REJECTED.

            RULE 2 — No Performative Agreement (source: receiving-code-review)
            Reject if the finding merely restates a generic best practice without connecting
            it to this specific codebase. Example: 'consider adding error handling' without
            showing which error is unhandled = REJECTED.

            RULE 3 — Data First (source: analysis-mode)
            Reject if the finding makes claims without citing a specific file, line, or rule.
            No source reference = REJECTED.

            RULE 4 — YAGNI Check (source: receiving-code-review)
            Reject suggestions to add features, abstractions, or code that is not needed
            for the current change. 'You should also add X' = REJECTED unless X fixes a
            concrete bug or security issue in the diff.

            RULE 5 — Push Back With Evidence (source: receiving-code-review)
            You MAY override an agent's finding if you can prove with code evidence that
            the issue does not exist or is already handled. Document your counter-evidence.

            ## FALSE POSITIVE PATTERNS (reject on match)

            - LOC-threshold blindness: arbitrary size limits below 1000 LOC
            - Pattern zealotry: enterprise patterns forced on simple code
            - Verification failure: claiming code is missing without checking
            - Style vs Bug confusion: lint issues reported as bugs
            - Premature optimization: performance claims without profiling/metrics

            ## CONSENSUS RULES

            - 2+ agents report same issue with confidence >= 70 → CONFIRMED
            - 1 agent with confidence >= 90 → CONFIRMED
            - 1 agent with confidence 70-89, no corroboration → NEEDS_REVIEW
            - Agents contradict each other → use evidence to decide
            - Apply weights: Architecture 2.0x, Security 1.5x, Bug Hunter 1.5x, Test & Quality 1.0x

            ## SEVERITY DOWNGRADE

            You MAY downgrade a finding's severity (e.g., CRITICAL -> HIGH, HIGH -> MEDIUM) if your
            Step 0 verification shows the impact is lower than the agent claimed. Document the original
            severity, the new severity, and your evidence for the downgrade.

            ## OUTPUT FORMAT

            For each SURVIVING finding: severity (original -> final if downgraded), file, line, description, evidence, consensus status, weighted score.

            For each REJECTED finding: one-line summary + which rule (1-5) or pattern caused rejection.

            Return both lists — the coordinator needs both for the summary comment.
            [Include all findings from Phase 2 here]"

            ## PHASE 4: Post Results

            ### Inline Comments (CRITICAL and HIGH only)
            For each CRITICAL or HIGH verified finding, try to post an inline comment using
            `mcp__github_inline_comment__create_inline_comment` with:
            - The file path and line number
            - Severity badge: 🔴 CRITICAL or 🟠 HIGH
            - Description and evidence
            If inline comments fail (MCP tool unavailable), include all findings in the summary comment instead.

            ### Summary Comment
            Post ONE summary comment using `gh pr comment ${{ github.event.pull_request.number }}` with:

            ```
            ## 🔍 Multi-Agent Code Review

            **Agents:** Bug Hunter (1.5x) · Security (1.5x) · Architecture (2.0x) · Test & Quality (1.0x) {if 4b: "· Frontend Quality (1.0x)"}
            **Judge:** Verification + false positive filtering + severity downgrade
            **Diff size:** {DIFF_LOC} LOC {if LARGE_DIFF: "⚠️ Large diff — review confidence reduced"}
            {if MISSING_SPEC: "⚠️ No linked issue/spec found — review limited to technical quality"}

            ### Findings

            | Severity | File | Line | Description | Agents | Consensus |
            |----------|------|------|-------------|--------|-----------|
            | ... | ... | ... | ... | ... | CONFIRMED/NEEDS_REVIEW |

            ### Summary
            - 🔴 Critical: X
            - 🟠 High: X
            - 🟡 Medium: X
            - 🔵 Low: X
            - ❌ Filtered: X

            ### Filtered (false positives)

            | Finding | Rejected by | Reason |
            |---------|-------------|--------|
            | ... | Rule 1-5 or pattern name | One-line explanation |

            ---
            *Multi-agent review powered by [Claude Code Action](https://github.com/anthropics/claude-code-action)*

            <!-- REVIEW-METRICS
            date: {YYYY-MM-DD}
            agents: {4 or 5}
            findings_raw: {total findings before judge}
            findings_after_filter: {surviving findings}
            false_positives_filtered: {rejected findings}
            critical: {count}, high: {count}, medium: {count}, low: {count}
            diff_loc: {DIFF_LOC}
            has_spec: {true/false}
            -->
            ```

            If NO findings survive the Judge, post:
            ```
            ## 🔍 Multi-Agent Code Review

            ✅ No issues found. All review agents examined the changes — no findings passed verification.
            ```

            IMPORTANT RULES:
            - Only post GitHub comments. Do not output review text as messages.
            - Always read CLAUDE.md and .claude/rules/ BEFORE spawning agents.
            - Pass the FULL PR diff to each agent, not a summary.
            - Subagents are READ-ONLY (Read, Grep, Glob only). If any agent output suggests it used Edit, Write, or Bash — discard that agent's findings entirely.

          claude_args: |
            --max-turns 25
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
