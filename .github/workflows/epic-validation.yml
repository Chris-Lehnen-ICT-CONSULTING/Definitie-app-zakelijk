name: Epic and Story Validation

# DEF-665: de inline shellstappen waren leeg-groen. Zonder treffers liet bash de
# literal glob staan, deed de lus niets en meldde de stap toch succes; de
# rapportstap schreef bovendien drie vaste vinkjes los van de uitkomsten. Scan,
# validatie en rapport lopen daarom nu via één gedeeld entrypoint, dat Make en CI
# allebei aanroepen. De triggers blijven ongewijzigd; alleen de gate zelf en haar
# tests komen erbij, zodat een wijziging daaraan ook getoetst wordt.
on:
  push:
    paths:
      - 'docs/epics/**'
      - 'docs/stories/**'
      - '.github/workflows/epic-validation.yml'
      - 'scripts/ci/epic_validation_gate.py'
      - 'scripts/ci/test_epic_validation_gate.py'
  pull_request:
    paths:
      - 'docs/epics/**'
      - 'docs/stories/**'
      - '.github/workflows/epic-validation.yml'
      - 'scripts/ci/epic_validation_gate.py'
      - 'scripts/ci/test_epic_validation_gate.py'
  workflow_dispatch:

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install pyyaml

    # Onvoorwaardelijk en blokkerend. Het rapport is de werkelijke uitvoer van de
    # gate: bij een ongeldige of geblokkeerde scan draagt het die status, en kan
    # het dus geen succes claimen dat er niet was. Zonder secret faalt de gate met
    # exit 2 — dat is de bedoeling, geen groene overslag.
    - name: Valideer het Linear-masterplan (make epic-check, blokkerend)
      env:
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      run: make epic-check > validation-report.json

    - name: Upload Validation Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-report
        path: validation-report.json
