name: Root allowlist

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check-root-allowlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run root allowlist check
        env:
          GITHUB_ACTIONS: "true"
        run: bash scripts/ci/check_root_allowlist.sh
