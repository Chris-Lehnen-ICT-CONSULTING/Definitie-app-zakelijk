name: Coverage Badge

on:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Generate coverage report
      run: |
        # PYTHONPATH=. zet de repo-root op sys.path zodat 'from src.X'-imports resolven.
        # De coverage-job installeert het pakket niet editable (anders dan lokaal), waardoor
        # 'src' anders geen importeerbaar package is → ModuleNotFoundError bij collection.
        PYTHONPATH=. pytest tests/unit/services tests/integration/services tests/integration/contracts --cov=src/services --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Create coverage badge
      uses: 5monkeys/cobertura-action@master
      with:
        path: coverage.xml
        minimum_coverage: 80
        skip_covered: false
        show_line: true
        show_branch: true
        show_class_names: true
        show_missing: true
        show_health: true
        report_name: Coverage Report
        only_changed_files: false
