name: Coverage Badge

on:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # requirements-dev.txt levert pytest-cov + pytest-asyncio (async_mode=auto in
        # pytest.ini); zonder pytest-asyncio faalden 195 async-tests met
        # "async def functions are not natively supported" — net als de groene test-jobs.
        pip install -r requirements-dev.txt

    - name: Generate coverage report
      env:
        # Gelijkgetrokken met de tests-job: services-tests bouwen een ServiceContainer
        # die een API-key vereist, en de suite blokkeert netwerk (conftest _disable_network).
        # Dummy keys voorkomen "API key is required" / netwerk-fouten (DEF-413).
        OPENAI_API_KEY: dummy
        OPENAI_API_KEY_PROD: dummy
        ANTHROPIC_API_KEY: dummy
      run: |
        # PYTHONPATH=src: imports zijn genormaliseerd naar 'from X' (DEF-414), src op sys.path.
        PYTHONPATH=src pytest tests/unit/services tests/integration/services tests/integration/contracts --cov=src/services --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Create coverage badge
      uses: 5monkeys/cobertura-action@master
      with:
        path: coverage.xml
        minimum_coverage: 80
        skip_covered: false
        show_line: true
        show_branch: true
        show_class_names: true
        show_missing: true
        show_health: true
        report_name: Coverage Report
        only_changed_files: false
