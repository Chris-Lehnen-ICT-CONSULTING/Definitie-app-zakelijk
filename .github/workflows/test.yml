name: Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    env:
      # DEF-427: unit-tests bouwen de DI-container, die een niet-lege API-key
      # vereist. Lokaal komt die uit .env; in CI ontbreekt .env → "API key is required".
      # Default-provider = anthropic → ANTHROPIC_API_KEY is nu de vereiste key; de
      # OPENAI-keys blijven staan voor tests die naar openai wisselen.
      # `dummy` is niet-leeg (container bouwt) én niet-`sk-` (integration-skip-guards
      # blijven skippen → geen echte API-calls). Conventie van contract-tests/ci/coverage-badge.
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      OPENAI_API_KEY_PROD: dummy
      # DEF-567: dummy-key-calls in de unit-suite falen toch — stop de
      # retry-stapeling (SDK 0 retries, 2s timeout, 1 poging in de async_api-laag),
      # net als op de integration-job (DEF-566). Productie-defaults ongewijzigd:
      # deze knoppen bestaan alleen via env. Kritieke pad unit-job ~2m31s → ~1,5-2 min.
      AI_CLIENT_TIMEOUT: "2"
      AI_SDK_MAX_RETRIES: "0"
      AI_RATE_LIMIT_MAX_RETRIES: "1"
      AI_RATE_LIMIT_BACKOFF_FACTOR: "1.0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # DEF-561: hergebruik wheel-cache tussen runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          # DEF-564: uv installeert ~5-10x sneller dan pip; --require-hashes
          # behoudt de hash-verificatie (security-gate DEF-426).
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Check namespace-collisions (DEF-409)
        run: bash scripts/ci/check_namespace_collisions.sh

      - name: Run linting (services only)
        run: |
          # DEF-466: blokkerend + fail-closed — geen `|| true` én geen stille no-op
          # als ruff ontbreekt (ruff zit in requirements-dev.txt).
          command -v ruff >/dev/null || { echo "::error::ruff niet geinstalleerd"; exit 1; }
          ruff check src/services

      - name: Run type checking (services only)
        run: |
          # Focus type checking op services-laag — strict sinds DEF-408
          if command -v mypy &> /dev/null; then
            mypy src/services --ignore-missing-imports
          fi

      - name: Run PR test suite (profiles)
        env:
          # Coverage scoped to services (what PR suite tests) - threshold advisory only
          # Full coverage enforcement in integration tests, not blocking PRs during development
          # DEF-564: -n 4 — de pr-profile bevat 4 sleep-bound orchestrator-
          # tests (~40s/stuk); parallel = max i.p.v. som.
          PYTEST_ADDOPTS: --cov=src/services --cov-report=xml --cov-report=term-missing -n 4 --dist loadfile
        run: |
          bash scripts/testing/run_tests.sh pr

      - name: Coverage ratchet (DEF-466/DEF-427, blokkerend)
        run: |
          # DEF-466/DEF-416: dwingt de 45%-vloer af op de volledige unit-suite (-m unit).
          # Blokkerend sinds DEF-427 de unit-suite groen kreeg in CI (46,44%).
          # Roept de canonieke Makefile-target aan (single source of truth, CLAUDE.md).
          make test-cov-ci

      - name: Services subpackage coverage (advisory)
        continue-on-error: true
        run: |
          # Advisory coverage on focused subset - reports but doesn't block PRs
          targets=(
            tests/integration/contracts/test_modular_validation_service_contract.py
            tests/unit/services/test_validation_aggregation_utils.py
            tests/integration/contracts/test_validation_degraded_contract.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_happy.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_failure.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_monitoring.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_feedback.py
          )
          # Guard against silent no-op when a target is renamed/moved
          for t in "${targets[@]}"; do
            if [ ! -f "$t" ]; then
              echo "::warning file=$t::advisory pytest target ontbreekt — update workflow"
            fi
          done
          # advisory: step is non-blocking via continue-on-error (geen `|| true` nodig)
          pytest -q "${targets[@]}" \
            --cov=src/services \
            --cov-report=term-missing

      - name: Upload coverage reports
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            .coverage

  integration-tests:
    runs-on: ubuntu-latest
    # DEF-560: bewust GEEN `needs: test` — de job is self-contained (eigen
    # checkout/install/env, geen artifact-afhankelijkheid). Parallel draaien
    # scheelt ~4 min wall-clock per push (~15 → ~11 min).

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip  # DEF-561: hergebruik wheel-cache tussen runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          # DEF-564: uv installeert ~5-10x sneller dan pip; --require-hashes
          # behoudt de hash-verificatie (security-gate DEF-426).
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests (parallel, zonder performance)
        env:
          # DEF-506: dummy is bewust GEEN sk-prefix zodat de module-level
          # skip-guards (echte-AI-tests) blijven skippen, terwijl de
          # DI-container-tests wel een key zien (precedent: test-job, DEF-427).
          # Sinds PR #349 is anthropic de default-provider → de container vereist
          # óók een niet-lege ANTHROPIC_API_KEY (zelfde conventie als de test-job).
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
          # DEF-566: dummy-key-calls falen toch — stop de retry-stapeling
          # (SDK 0 retries, 2s timeout, 1 poging in de async_api-laag).
          # Gemeten lokaal: 44s → 3s per generatie-test; stap A 2m32s → 16s.
          # Productie-defaults ongewijzigd (knoppen alleen via env).
          AI_CLIENT_TIMEOUT: "2"
          AI_SDK_MAX_RETRIES: "0"
          AI_RATE_LIMIT_MAX_RETRIES: "1"
          AI_RATE_LIMIT_BACKOFF_FACTOR: "1.0"
        run: |
          # DEF-506: integration-gate is BLOKKEREND — `|| true` (DEF-466) is weg.
          # Onderstaande --deselect's zijn bestanden met pre-existing failures
          # (61 tests over 16 bestanden, gedocumenteerd in DEF-506/PR) — dat is
          # tech-debt, geen maskering.
          # DEF-561: xdist — de 13 trage generatie-tests zijn sleep-bound
          # (geneste retry-lagen op de dummy-key, ~40s/stuk) en
          # parallelliseren perfect: lokaal ~10,5 min → 2m32s.
          # DEF-564: --dist load (per test) i.p.v. loadfile — het kritieke pad
          # was anders het traagste BESTAND (~200s). Volgorde-onafhankelijkheid
          # is geborgd: pytest-randomly schudt de volgorde al in elke run.
          # tests/integration/performance draait APART en serieel (volgende
          # stap): timing-asserts zijn onbetrouwbaar onder CPU-concurrentie.
          # DEF-561/review: test_duplicate_detection_fix + test_history_removal
          # gebruiken de default-repository (cwd-relatieve data/definities.db)
          # en zijn dus niet hermetisch onder parallelle workers → serieel in
          # de volgende stap. Hermetisch maken = DEF-562.
          # LET OP: --ignore werkt hier NIET (pytest 9 + deze config negeert
          # het stil — empirisch geverifieerd, run 28798987445 draaide de
          # performance-map gewoon mee). --deselect op de map werkt wél.
          if [ -d "tests/integration" ]; then
            pytest tests/integration/ -v -n 8 --dist load \
              --deselect tests/integration/performance \
              --deselect "tests/integration/services/test_batch_validation.py::test_batch_validate_performance_benefit" \
              --deselect tests/integration/test_duplicate_detection_fix.py \
              --deselect tests/integration/test_history_removal.py \
              --deselect tests/integration/compliance/test_architecture_consolidation.py \
              --deselect tests/integration/compliance/test_per007_documentation_compliance.py \
              --deselect tests/integration/database/test_unique_constraint_removal.py \
              --deselect tests/integration/regression/test_category_regeneration.py \
              --deselect tests/integration/regression/test_regression_suite.py \
              --deselect tests/integration/regression/test_story_2_4_regression.py \
              --deselect tests/integration/security/test_security_comprehensive.py \
              --deselect tests/integration/test_per007_acceptance.py \
              --deselect tests/integration/test_per007_single_source_red.py \
              --deselect tests/integration/test_synonym_orchestrator_e2e.py \
              --deselect tests/integration/test_validate_synonyms.py \
              --deselect tests/integration/test_voorbeelden_validation_chain.py
          fi

      - name: Run niet-hermetische DB-tests (serieel, blokkerend)
        env:
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: |
          # DEF-561/DEF-562: functionele tests op de gedeelde default-DB —
          # serieel (niet xdist-veilig) maar wél hard blokkerend.
          pytest -v \
            tests/integration/test_duplicate_detection_fix.py \
            tests/integration/test_history_removal.py

      - name: Run performance tests (serieel, advisory)
        continue-on-error: true  # DEF-563: hardware-timing-asserts faalden
        # 2026-07-06 tweemaal puur op trage runner-VM's (throughput 608 vs
        # >1000 ops/sec; orchestrator-init 484 vs <400ms) en blokkeerden
        # merges onterecht. Advisory tot de drempels runner-bewust zijn
        # geherkalibreerd (DEF-563); resultaten blijven zichtbaar in de run.
        env:
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: |
          # Serieel: timing-asserts zijn onbetrouwbaar onder xdist-CPU-
          # concurrentie. Deselects = pre-existing failures (DEF-506).
          if [ -d "tests/integration/performance" ]; then
            pytest tests/integration/performance/ -v \
              "tests/integration/services/test_batch_validation.py::test_batch_validate_performance_benefit" \
              --deselect tests/integration/performance/test_def110_regression.py \
              --deselect tests/integration/performance/test_per007_performance.py \
              --deselect tests/integration/performance/test_performance_comprehensive.py \
              --deselect tests/integration/performance/test_rule_cache_performance.py
          fi

  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run security checks
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
