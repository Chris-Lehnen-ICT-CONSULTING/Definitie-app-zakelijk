name: Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    env:
      # DEF-427: unit-tests bouwen de DI-container, die een niet-lege API-key
      # vereist. Lokaal komt die uit .env; in CI ontbreekt .env → "API key is required".
      # Default-provider = anthropic → ANTHROPIC_API_KEY is nu de vereiste key; de
      # OPENAI-keys blijven staan voor tests die naar openai wisselen.
      # `dummy` is niet-leeg (container bouwt) én niet-`sk-` (integration-skip-guards
      # blijven skippen → geen echte API-calls). Conventie van contract-tests/ci.
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      OPENAI_API_KEY_PROD: dummy
      # DEF-567: dummy-key-calls in de unit-suite falen toch — stop de
      # retry-stapeling (SDK 0 retries, 2s timeout, 1 poging in de async_api-laag),
      # net als op de integration-job (DEF-566). Productie-defaults ongewijzigd:
      # deze knoppen bestaan alleen via env. Kritieke pad unit-job ~2m31s → ~1,5-2 min.
      AI_CLIENT_TIMEOUT: "2"
      AI_SDK_MAX_RETRIES: "0"
      AI_RATE_LIMIT_MAX_RETRIES: "1"
      AI_RATE_LIMIT_BACKOFF_FACTOR: "1.0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # DEF-561: hergebruik wheel-cache tussen runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          # DEF-564: uv installeert ~5-10x sneller dan pip; --require-hashes
          # behoudt de hash-verificatie (security-gate DEF-426).
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Check namespace-collisions (DEF-409)
        run: bash scripts/ci/check_namespace_collisions.sh

      - name: Run linting (services only)
        run: |
          # DEF-466: blokkerend + fail-closed — geen `|| true` én geen stille no-op
          # als ruff ontbreekt (ruff zit in requirements-dev.txt).
          command -v ruff >/dev/null || { echo "::error::ruff niet geinstalleerd"; exit 1; }
          ruff check src/services

      # DEF-568: mypy `src/services` weggehaald van het kritieke pad (was ~42s) —
      # aantoonbaar redundant. De blokkerende `Mypy Ratchet`-job (quality-gates.yml)
      # draait al parallel `mypy src/ --check-untyped-defs` met baseline 0; omdat
      # src/services ⊂ src/ borgt die gate de services-subtree al schoon
      # (gemeten 2026-07-07: beide invocaties 0 errors). Zie DEF-567 (verkeerde
      # diagnose) → DEF-568 (echte fix): unit-job 2m26s → ~1m44s.

      # DEF-519: één bewaakte poort. De oude `run_tests.sh pr`-stap met
      # `PYTEST_ADDOPTS` is vervallen: die selecteerde via de omgeving een eigen
      # profiel naast de Makefile, waardoor CI en `make` niet dezelfde scope
      # draaiden. De ratchet-stap hieronder draait nu exact dezelfde
      # unitselectie (ALLE unittests, inclusief `slow`) als `make test-unit`,
      # plus de meting tegen de 45%-vloer. Lege selectie, collectiefout,
      # toolfout, testfalen en budgetoverschrijding geven elk een eigen nonzero
      # status; er is geen fallback en geen stille groene route.
      - name: Unit gate + coverage ratchet (make test-cov-ci, blokkerend)
        run: make test-cov-ci

      # DEF-519: acceptance-smoke is een verplichte gate, niet langer een
      # ongedraaid profiel. Dezelfde runner, eigen artefactpaden.
      - name: Acceptance/smoke gate (make test-acceptance, blokkerend)
        run: make test-acceptance

      # DEF-519: de oude "Services subpackage coverage (advisory)"-stap is
      # vervallen. Die draaide een handmatig bijgehouden bestandslijst, schreef
      # als laatste een `.coverage` in de checkout en overschreef daarmee de
      # meting van de ratchet (DEF-679). De subset zit inmiddels volledig in de
      # unit- en integrationgates; wat bewust buiten die gates valt, draagt een
      # expliciete `advisory`-, `future`- of `live`-marker met eigenaar, reden,
      # trigger en herbeoordelingsdatum (docs/testing/def519-testdispositions.json).
      # Er wordt hier dus geen niet-vrijgegeven diagnostiek automatisch gedraaid.

      - name: Verzamel de coveragedata van de ratchet
        if: always()
        run: |
          # De runner meet in een verse sessieroot; het pad staat in de
          # inventaris. Kopieer (nooit verplaatsen/verwijderen) zodat de upload
          # de werkelijk geproduceerde datafile bevat.
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          inventaris = Path("reports/gates/unit-cov-inventaris.json")
          if not inventaris.is_file():
              raise SystemExit(0)
          artefact = json.loads(inventaris.read_text()).get("coverage_artefacten")
          if not artefact:
              raise SystemExit(0)
          bron = Path(artefact["data_file"])
          if bron.is_file():
              shutil.copy(bron, Path("reports/gates") / "unit-coverage-data")
              print(f"coveragedata gekopieerd uit {bron}")
          PY

      # DEF-678: Codecov-upload verwijderd, samen met de hele workflow
      # `coverage-badge.yml`. Die workflow faalde 100 van 100 runs sinds
      # 2026-06-23: de cobertura-action wilde een check-run aanmaken met een
      # read-only GITHUB_TOKEN (`default_workflow_permissions: read`) en gaf
      # `Resource not accessible by integration`. Hij stond niet bij de required
      # checks en had geen consument — er is geen coverage-badge in README.md.
      # De Codecov-stap hier faalde stil: er is nooit een `CODECOV_TOKEN` op deze
      # repo geweest, dus elke upload gaf "Token required - not valid tokenless
      # upload" terwijl de stap `success` rapporteerde. De input heette bovendien
      # `file` waar codecov-action@v7 `files` verwacht.
      # De blokkerende vloer blijft de ratchet-stap hierboven.

      # DEF-519/DEF-679: de oude step-summary las het `.coverage` uit de
      # checkout, dat door de advisory-stap was overschreven — het toonde dus de
      # verkeerde scope. De gate print haar eigen totaal
      # (`[run_profile:coverage] totaal=..`) in de stap hierboven en levert de
      # meting als XML op; die twee zijn de bron.
      - name: Coverage-totaal in step summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml = Path("reports/gates/unit-coverage.xml")
          if not xml.is_file():
              print("Geen coveragerapport van de unitgate gevonden.")
          else:
              wortel = ET.parse(xml).getroot()
              tarief = float(wortel.get("line-rate", "0")) * 100
              print(f"### Unitgate coverage: {tarief:.2f}% (vloer 45%)")
          PY

      - name: Archive gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            reports/gates/

  integration-tests:
    runs-on: ubuntu-latest
    # DEF-560: bewust GEEN `needs: test` — de job is self-contained (eigen
    # checkout/install/env, geen artifact-afhankelijkheid). Parallel draaien
    # scheelt ~4 min wall-clock per push (~15 → ~11 min).

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip  # DEF-561: hergebruik wheel-cache tussen runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          # DEF-564: uv installeert ~5-10x sneller dan pip; --require-hashes
          # behoudt de hash-verificatie (security-gate DEF-426).
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Integration gate (make test-integration, blokkerend)
        env:
          # DEF-506: dummy is bewust GEEN sk-prefix zodat de module-level
          # skip-guards (echte-AI-tests) blijven skippen, terwijl de
          # DI-container-tests wel een key zien (precedent: test-job, DEF-427).
          # Sinds PR #349 is anthropic de default-provider → de container vereist
          # óók een niet-lege ANTHROPIC_API_KEY (zelfde conventie als de test-job).
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
          # DEF-566: dummy-key-calls falen toch — stop de retry-stapeling
          # (SDK 0 retries, 2s timeout, 1 poging in de async_api-laag).
          # Gemeten lokaal: 44s → 3s per generatie-test; stap A 2m32s → 16s.
          # Productie-defaults ongewijzigd (knoppen alleen via env).
          AI_CLIENT_TIMEOUT: "2"
          AI_SDK_MAX_RETRIES: "0"
          AI_RATE_LIMIT_MAX_RETRIES: "1"
          AI_RATE_LIMIT_BACKOFF_FACTOR: "1.0"
        run: |
          # DEF-519: één canonieke integrationgate in plaats van drie stappen
          # met eigen selecties. Wat er is veranderd en waarom:
          #
          # * De `--deselect`-lijst van hele bestanden is weg. Wat werkelijk
          #   buiten de gate hoort, draagt nu een expliciete `advisory`-,
          #   `future`- of `live`-marker mét eigenaar, reden, trigger en
          #   herbeoordelingsdatum (docs/testing/def519-testdispositions.json).
          #   Alle overige nodes uit die bestanden — inclusief de actieve
          #   contracten die er tussen zaten — draaien nu wél verplicht mee.
          # * De `if [ -d "tests/integration" ]`-route is weg: een ontbrekende
          #   map leverde stil succes op. Een lege selectie is nu nonzero.
          # * De aparte serieele DB-stap is niet meer nodig: de runner draait in
          #   een verse werkmap, dus het CWD-relatieve `data/definities.db` van
          #   test_duplicate_detection_fix/test_history_removal landt in
          #   tijdelijke opslag in plaats van in de checkout (DEF-562-patroon).
          # * De advisory performance-stap is vervallen. De integrationunie
          #   dekt `tests/integration/performance` via het pad; de nodes die
          #   bewust buiten scope zijn, zijn per node advisory gemarkeerd. De
          #   overige performance-nodes zijn hiermee weer blokkerend — zie
          #   DEF-563 voor de runner-bewuste drempels.
          # * Geen xdist: de runner-allowlist laat `-n/--dist` niet door omdat
          #   de gedeelde inventaris controller- en workerinformatie niet
          #   gescheiden vastlegt. Er wordt hier geen versnelling geclaimd.
          make test-integration

      - name: Archive gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-gate-results
          path: |
            reports/gates/

  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run security checks
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
