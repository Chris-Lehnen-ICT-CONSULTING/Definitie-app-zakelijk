name: Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/DEF-*
      - fix/DEF-*
      - DEF-*
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check namespace-collisions (DEF-409)
        run: bash scripts/ci/check_namespace_collisions.sh

      - name: Run linting (services only)
        run: |
          # DEF-466: blokkerend — geen `|| true`-maskering meer (src/services is ruff-clean)
          if command -v ruff &> /dev/null; then
            ruff check src/services
          fi

      - name: Run type checking (services only)
        run: |
          # Focus type checking op services-laag — strict sinds DEF-408
          if command -v mypy &> /dev/null; then
            mypy src/services --ignore-missing-imports
          fi

      - name: Run PR test suite (profiles)
        env:
          # Coverage scoped to services (what PR suite tests) - threshold advisory only
          # Full coverage enforcement in integration tests, not blocking PRs during development
          PYTEST_ADDOPTS: --cov=src/services --cov-report=xml --cov-report=term-missing
        run: |
          bash scripts/testing/run_tests.sh pr

      - name: Coverage ratchet (DEF-466, blokkerend)
        run: |
          # DEF-466/DEF-416: dwingt de 45%-vloer af op de volledige unit-suite.
          # Unit-only (deterministisch); integration hangt nog (DEF-428/429).
          # Verhoog de vloer richting 80/85% naarmate coverage groeit.
          pytest -q --cov=src --cov-report=term-missing --cov-fail-under=45 -m unit

      - name: Services subpackage coverage (advisory)
        continue-on-error: true
        run: |
          # Advisory coverage on focused subset - reports but doesn't block PRs
          targets=(
            tests/integration/contracts/test_modular_validation_service_contract.py
            tests/unit/services/test_validation_aggregation_utils.py
            tests/integration/contracts/test_validation_degraded_contract.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_happy.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_failure.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_monitoring.py
            tests/integration/services/orchestrators/test_definition_orchestrator_v2_feedback.py
          )
          # Guard against silent no-op when a target is renamed/moved
          for t in "${targets[@]}"; do
            if [ ! -f "$t" ]; then
              echo "::warning file=$t::advisory pytest target ontbreekt — update workflow"
            fi
          done
          # advisory: step is non-blocking via continue-on-error (geen `|| true` nodig)
          pytest -q "${targets[@]}" \
            --cov=src/services \
            --cov-report=term-missing

      - name: Upload coverage reports
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            .coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          # DEF-466: `|| true` blijft TIJDELIJK tot de integration-hangs zijn opgelost
          # (DEF-428/429: echte-API/timing-tests hangen zonder geldige sk-key).
          # Verwijder deze maskering zodra de hangs gevalideerd zijn; overweeg intussen
          # `-m 'integration and not requires_api_key'`.
          if [ -d "tests/integration" ]; then
            pytest tests/integration/ -v || true
          fi

  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run security checks
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
