name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-pre-commit:
    name: Verify Pre-commit Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history to check commits

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pre-commit
          # Install ripgrep for no-todo-markers hook
          sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check pre-commit ran on latest commit
        env:
          # DEF-522: de ondergrens komt uit de event-payload en gaat uitsluitend
          # via de omgeving naar de stap; nooit als expressie in een shellregel.
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # DEF-522: `--files` geeft hooks die een commitrange nodig hebben geen
          # bereik. Op een schone checkout is er geen index, dus de secret-gate
          # kreeg daar nul bytes te zien. `--from-ref`/`--to-ref` geeft dat bereik
          # wél door (pre-commit zet dan PRE_COMMIT_FROM_REF en PRE_COMMIT_TO_REF)
          # en draait nog steeds álle hooks, over dezelfde gewijzigde bestanden.
          echo "Verifying pre-commit execution..."
          VAN="$VERIFY_BASE_SHA"
          # De werkelijk uitgecheckte HEAD, zodat het bereik samenvalt met de tree
          # die de hooks zien — ook bij de merge-checkout van een pull request.
          NAAR="$(git rev-parse HEAD)"

          # Fail-closed: zonder een bruikbaar bereik wordt er niet gescand, en dan
          # is er ook niets bewezen. Geen terugval op een smaller bereik, geen
          # overslaan bij een leeg bereik.
          if ! [[ "$VAN" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$NAAR" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Geen bruikbare commitrange voor de pre-commit-verificatie."
            exit 1
          fi

          pre-commit run --from-ref "$VAN" --to-ref "$NAAR"

          echo "✅ Pre-commit verification passed"

  preflight-checks:
    name: Run Preflight Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run preflight-checks.sh
        run: |
          # Copy preflight checks from unified agent dir if available
          # Otherwise, create minimal version
          if [ -f "$HOME/.ai-agents/preflight-checks.sh" ]; then
            bash "$HOME/.ai-agents/preflight-checks.sh"
          else
            # Fallback: run key checks inline
            echo "🛡️  Running inline preflight checks..."

            # Check forbidden imports
            echo "📦 Checking forbidden imports..."
            if rg -q "import streamlit" src/services/ 2>/dev/null; then
              echo "❌ Found 'import streamlit' in services/"
              exit 1
            fi

            # Check for hardcoded secrets
            echo "🔒 Checking for hardcoded secrets..."
            if rg -q "api_key.*=.*[\"'][A-Za-z0-9]" --type py 2>/dev/null; then
              echo "❌ Potential hardcoded API key found"
              exit 1
            fi

            # Check for TODO markers in staged code
            echo "📋 Checking for TODO markers..."
            if rg -q "TODO|FIXME|XXX|HACK" --type py 2>/dev/null; then
              echo "⚠️  Found TODO markers (should use backlog)"
              # Warning only, not fatal
            fi

            echo "✅ Preflight checks passed"
          fi

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validating branch name: $BRANCH_NAME"

          # Valid patterns: feature/*, fix/*, bugfix/*, hotfix/*, docs/*, refactor/*, test/*, chore/*, dependabot/*, DEF-123/*
          # Note: dependabot/* is allowed so bot-generated dependency PRs (which cannot follow the {KEY}-XX convention) pass the gate.
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|bugfix|hotfix|docs|refactor|test|chore|dependabot|DEF-[0-9]+)/.+ ]]; then
            echo "✅ Branch name follows convention"
          else
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch names must follow pattern: {type}/{description} or DEF-{issue}/{description}"
            echo "Valid types: feature, fix, bugfix, hotfix, docs, refactor, test, chore, dependabot, DEF-{number}"
            exit 1
          fi

  complexity-ratchet:
    name: Complexity Ratchet (DEF-418)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dev tools (ruff from requirements-dev.txt)
        # DEF-442: install from requirements-dev.txt instead of hardcoding, so a
        # ruff bump there flows into this job (and the pin-gate keeps it in sync
        # with the pre-commit rev). Same approach as the mypy job — robust against
        # comments/markers, no fragile shell extraction. The baseline count is tied
        # to the ruff version — when ruff is bumped, re-measure
        # scripts/complexity_baseline.txt in the same change.
        run: pip install -r requirements-dev.txt

      - name: Check complexity has not grown
        run: python scripts/complexity_ratchet.py

  dead-code-ratchets:
    name: Dead-code Ratchets (DEF-600/DEF-393)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Geen pip install: beide scripts draaien op pure stdlib (ast, pathlib,
      # argparse), net als mypy_overrides_ratchet.py. Scheelt ~40s installatie
      # en maakt de gate onafhankelijk van dependency-drift.

      - name: Check verweesde modules zijn niet gegroeid (DEF-600)
        # Faalt als een module zonder enige importer erbij komt. Beide fout-
        # richtingen van de detector wijzen naar "te weinig wezen", dus een
        # rode gate hier betekent altijd een echte nieuwe wees.
        run: make orphan-check

      - name: Check stille exception-handlers zijn niet gegroeid (DEF-393)
        # Telt alleen brede handlers zonder logging en zonder re-raise. Een
        # bewuste fallback haal je uit de telling met
        # `# Intentional broad catch: <reden>` boven de handler.
        run: make silent-except-check

  mypy-ratchet:
    name: Mypy Ratchet (DEF-419)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies (mypy from requirements-dev.txt)
        # DEF-442: single source — mypy is pinned only in requirements-dev.txt, so
        # a bump there flows into this job and the ratchet runs under the new
        # version (baseline drift becomes a visible CI failure). The error count is
        # tied to the mypy version — when bumped, re-measure scripts/mypy_baseline.txt
        # in the same change. BOTH requirements files are installed: requirements-dev.txt
        # ships type stubs that resolve 6 errors (without it the count is higher).
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check mypy errors have not grown
        run: python scripts/mypy_ratchet.py

      - name: Check mypy override list has not grown (DEF-431)
        # Pure stdlib (tomllib) — parses pyproject.toml, no mypy run needed.
        # Blocks grandfathering new untyped modules into [[tool.mypy.overrides]].
        run: python scripts/mypy_overrides_ratchet.py

  tool-pins:
    name: Tool Pin Consistency (DEF-430/442)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check tool pins are in sync
        # DEF-442: dedicated gate so a deps-only PR (e.g. dependabot bumping
        # requirements-dev.txt) cannot skip the pin check via profile-based test
        # selection. Pure stdlib file parsing — no tools installed.
        run: python scripts/check_tool_pins.py


  lock-sync:
    name: Lock Sync (DEF-559/DEF-711)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        # Gepind: de resolve-uitvoer is versie-afhankelijk, dus een afwijkende
        # uv hier zou de gate anders laten oordelen dan lokaal. Houd deze pin
        # gelijk aan de uv waarmee `make lock` lokaal gedraaid wordt.
        run: python -m pip install uv==0.12.9

      - name: Check lock is a valid resolution of the .in sources
        # DEF-711: bewaakt dat requirements*.txt hoort bij requirements*.in.
        # Alleen resolven, geen install — goedkoop.
        #
        # Deze gate toetst SYNC, niet actualiteit: nieuwe upstream-releases maken
        # hem niet rood. Dependabot bewerkt de lock chirurgisch in plaats van
        # volledig te hercompileren en kan daarbij een directe pin verliezen (zo
        # verdween setuptools in PR #417). Staat deze job rood op een
        # Dependabot-PR, draai dan lokaal `make lock` en push naar die branch.
        run: bash scripts/ci/check_lock_sync.sh

  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [verify-pre-commit, preflight-checks, validate-branch-name, complexity-ratchet, mypy-ratchet, tool-pins, dead-code-ratchets, lock-sync]
    if: always()

    steps:
      - name: Check all gates passed
        run: |
          echo "📊 Quality Gate Summary"
          echo "======================="
          echo "Pre-commit: ${{ needs.verify-pre-commit.result }}"
          echo "Preflight: ${{ needs.preflight-checks.result }}"
          echo "Branch name: ${{ needs.validate-branch-name.result }}"
          echo "Complexity ratchet: ${{ needs.complexity-ratchet.result }}"
          echo "Mypy ratchet: ${{ needs.mypy-ratchet.result }}"
          echo "Dead-code ratchets: ${{ needs.dead-code-ratchets.result }}"
          echo "Tool pins: ${{ needs.tool-pins.result }}"
          echo "Lock sync: ${{ needs.lock-sync.result }}"

          if [ "${{ needs.verify-pre-commit.result }}" != "success" ] || \
             [ "${{ needs.preflight-checks.result }}" != "success" ] || \
             [ "${{ needs.complexity-ratchet.result }}" != "success" ] || \
             [ "${{ needs.mypy-ratchet.result }}" != "success" ] || \
             [ "${{ needs.dead-code-ratchets.result }}" != "success" ] || \
             [ "${{ needs.lock-sync.result }}" != "success" ] || \
             [ "${{ needs.tool-pins.result }}" != "success" ]; then
            echo "❌ Quality gates failed"
            exit 1
          fi

          # Branch validation only required for PRs
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ needs.validate-branch-name.result }}" != "success" ]; then
            echo "❌ Branch name validation failed"
            exit 1
          fi

          echo "✅ All quality gates passed"
