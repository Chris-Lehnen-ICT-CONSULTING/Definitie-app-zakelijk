name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-pre-commit:
    name: Verify Pre-commit Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history to check commits

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pre-commit
          # Install ripgrep for no-todo-markers hook
          sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check pre-commit ran on latest commit
        run: |
          # Check if pre-commit hooks were executed
          # Look for pre-commit metadata in commit or validate hooks pass
          echo "Verifying pre-commit execution..."

          # Run pre-commit on changed files to verify
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, check changed files
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Changed files: $CHANGED_FILES"
              # Run pre-commit on changed files
              echo "$CHANGED_FILES" | xargs pre-commit run --files || {
                echo "❌ Pre-commit hooks failed. Did you run pre-commit before pushing?"
                exit 1
              }
            fi
          else
            # For direct pushes, check last commit
            git show --name-only HEAD | tail -n +2 | xargs -r pre-commit run --files || {
              echo "❌ Pre-commit hooks failed. Run 'pre-commit run --all-files' locally."
              exit 1
            }
          fi

          echo "✅ Pre-commit verification passed"

  preflight-checks:
    name: Run Preflight Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run preflight-checks.sh
        run: |
          # Copy preflight checks from unified agent dir if available
          # Otherwise, create minimal version
          if [ -f "$HOME/.ai-agents/preflight-checks.sh" ]; then
            bash "$HOME/.ai-agents/preflight-checks.sh"
          else
            # Fallback: run key checks inline
            echo "🛡️  Running inline preflight checks..."

            # Check forbidden imports
            echo "📦 Checking forbidden imports..."
            if rg -q "import streamlit" src/services/ 2>/dev/null; then
              echo "❌ Found 'import streamlit' in services/"
              exit 1
            fi

            # Check for hardcoded secrets
            echo "🔒 Checking for hardcoded secrets..."
            if rg -q "api_key.*=.*[\"'][A-Za-z0-9]" --type py 2>/dev/null; then
              echo "❌ Potential hardcoded API key found"
              exit 1
            fi

            # Check for TODO markers in staged code
            echo "📋 Checking for TODO markers..."
            if rg -q "TODO|FIXME|XXX|HACK" --type py 2>/dev/null; then
              echo "⚠️  Found TODO markers (should use backlog)"
              # Warning only, not fatal
            fi

            echo "✅ Preflight checks passed"
          fi

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validating branch name: $BRANCH_NAME"

          # Valid patterns: feature/*, fix/*, bugfix/*, hotfix/*, docs/*, refactor/*, test/*, chore/*, dependabot/*, DEF-123/*
          # Note: dependabot/* is allowed so bot-generated dependency PRs (which cannot follow the {KEY}-XX convention) pass the gate.
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|bugfix|hotfix|docs|refactor|test|chore|dependabot|DEF-[0-9]+)/.+ ]]; then
            echo "✅ Branch name follows convention"
          else
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch names must follow pattern: {type}/{description} or DEF-{issue}/{description}"
            echo "Valid types: feature, fix, bugfix, hotfix, docs, refactor, test, chore, dependabot, DEF-{number}"
            exit 1
          fi

  complexity-ratchet:
    name: Complexity Ratchet (DEF-418)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dev tools (ruff from requirements-dev.txt)
        # DEF-442: install from requirements-dev.txt instead of hardcoding, so a
        # ruff bump there flows into this job (and the pin-gate keeps it in sync
        # with the pre-commit rev). Same approach as the mypy job — robust against
        # comments/markers, no fragile shell extraction. The baseline count is tied
        # to the ruff version — when ruff is bumped, re-measure
        # scripts/complexity_baseline.txt in the same change.
        run: pip install -r requirements-dev.txt

      - name: Check complexity has not grown
        run: python scripts/complexity_ratchet.py

  mypy-ratchet:
    name: Mypy Ratchet (DEF-419)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (mypy from requirements-dev.txt)
        # DEF-442: single source — mypy is pinned only in requirements-dev.txt, so
        # a bump there flows into this job and the ratchet runs under the new
        # version (baseline drift becomes a visible CI failure). The error count is
        # tied to the mypy version — when bumped, re-measure scripts/mypy_baseline.txt
        # in the same change. BOTH requirements files are installed: requirements-dev.txt
        # ships type stubs that resolve 6 errors (without it the count is higher).
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check mypy errors have not grown
        run: python scripts/mypy_ratchet.py

      - name: Check mypy override list has not grown (DEF-431)
        # Pure stdlib (tomllib) — parses pyproject.toml, no mypy run needed.
        # Blocks grandfathering new untyped modules into [[tool.mypy.overrides]].
        run: python scripts/mypy_overrides_ratchet.py

  tool-pins:
    name: Tool Pin Consistency (DEF-430/442)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check tool pins are in sync
        # DEF-442: dedicated gate so a deps-only PR (e.g. dependabot bumping
        # requirements-dev.txt) cannot skip the pin check via profile-based test
        # selection. Pure stdlib file parsing — no tools installed.
        run: python scripts/check_tool_pins.py

  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [verify-pre-commit, preflight-checks, validate-branch-name, complexity-ratchet, mypy-ratchet, tool-pins]
    if: always()

    steps:
      - name: Check all gates passed
        run: |
          echo "📊 Quality Gate Summary"
          echo "======================="
          echo "Pre-commit: ${{ needs.verify-pre-commit.result }}"
          echo "Preflight: ${{ needs.preflight-checks.result }}"
          echo "Branch name: ${{ needs.validate-branch-name.result }}"
          echo "Complexity ratchet: ${{ needs.complexity-ratchet.result }}"
          echo "Mypy ratchet: ${{ needs.mypy-ratchet.result }}"
          echo "Tool pins: ${{ needs.tool-pins.result }}"

          if [ "${{ needs.verify-pre-commit.result }}" != "success" ] || \
             [ "${{ needs.preflight-checks.result }}" != "success" ] || \
             [ "${{ needs.complexity-ratchet.result }}" != "success" ] || \
             [ "${{ needs.mypy-ratchet.result }}" != "success" ] || \
             [ "${{ needs.tool-pins.result }}" != "success" ]; then
            echo "❌ Quality gates failed"
            exit 1
          fi

          # Branch validation only required for PRs
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ needs.validate-branch-name.result }}" != "success" ]; then
            echo "❌ Branch name validation failed"
            exit 1
          fi

          echo "✅ All quality gates passed"
