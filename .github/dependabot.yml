version: 2
updates:
  # Python dependencies - requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "automated"
    reviewers:
      - "ChrisLehnen"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    # Group all patch and minor updates together
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore mando updates due to radon dependency conflict
    ignore:
      - dependency-name: "mando"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Tijdelijk uitgesloten — vereist een bewuste, app-geteste upgrade i.p.v. een gegroepeerde bump.
      # VERWIJDEREN zodra de bijbehorende story klaar is:
      #   - anthropic: aparte SDK-upgrade-story (0.49 → 0.105+, changelog-review + generatie-smoke) → DEF-412
      # streamlit-ignore verwijderd in DEF-411 (streamlit 1.58.0 + pandas 3.0.3 upgrade)
      - dependency-name: "anthropic"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Amsterdam"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    reviewers:
      - "ChrisLehnen"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    # Group all GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"

