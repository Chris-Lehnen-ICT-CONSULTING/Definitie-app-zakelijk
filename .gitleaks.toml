# Gitleaks Configuration for DefinitieAgent
# Version: 8.29.1 (gepinde broncommit fb5d707e08fe0d2578b155458fdd53b6782dcab2)
# See: https://github.com/gitleaks/gitleaks
#
# DEF-522: de vier brede globale allowlists en de brede rule-scoped allowlist
# zijn vervallen. Er is nog precies één uitzondering, hieronder, en die geldt
# alleen voor één exact pad in combinatie met één exacte waarde.

title = "DefinitieAgent Secret Detection Configuration"

# Use default Gitleaks rules (100+ patterns)
# This includes: OpenAI, AWS, GitHub, Google, Azure, JWT, private keys, etc.
[extend]
useDefault = true

# De enige uitzondering. `condition = "AND"` betekent dat pad én waarde beide
# moeten matchen: een uitzondering die naar een ander pad verhuist of waarvan de
# inhoud verandert, geldt niet meer. Geen prefix, geen sleuteltype, geen map.
#
# `targetRules` is hier geen detail maar de voorwaarde waaronder die AND werkt.
# Een globale allowlist met `paths` wordt in de gepinde bron toegepast als
# pad-skip (`sources/common.go:37-52`, `shouldSkipPath` → `PathAllowed`): het
# pad wordt overgeslagen vóórdat de inhoud wordt bekeken, en `condition` weegt
# daar niet mee. Pas met `targetRules` hangt de uitzondering aan de regel zelf
# (`config/config.go:233-240`), en daar eerbiedigt `detect.go` de AND-conditie
# wel. Zonder die koppeling zou het pad alleen al een vrijbrief zijn en zou een
# afwijkende waarde op dit pad stil passeren.
#
# Rationale: de waarde is in deze sessie offline zelf samengesteld, niet bij een
# provider opgevraagd en niet voor authenticatie gebruikt; er is geen historische
# waarde hergebruikt. De fixture bestaat om aantoonbaar te maken dat de gate
# exact dit pad en exact deze waarde doorlaat.
#
# Eigenaar: Chris Lehnen (DEF-522). Herbeoordelen op 2026-12-07.
#
# De regex staat hier als `AK[I]A...`: dat matcht exact dezelfde waarde, maar
# houdt dit configbestand zelf vrij van een aaneengesloten sleutelvorm. Zonder
# die schrijfwijze zou de gate haar eigen configuratie blokkeren — de
# uitzondering geldt immers alleen voor het fixture-pad.
[[allowlists]]
description = """DEF-522 synthetische AWS-fixture: uitsluitend het exacte pad \
tests/fixtures/def522_synthetic_aws.txt in combinatie met de exacte waarde, in \
deze sessie offline zelf samengesteld. Eigenaar Chris Lehnen (DEF-522); \
herbeoordelen op 2026-12-07."""
condition = "AND"
targetRules = ["aws-access-token"]
paths = ['''^tests/fixtures/def522_synthetic_aws\.txt$''']
regexTarget = "secret"
regexes = ['''^AK[I]A3QK7XZ2MJ5R6W4TB$''']

# Custom rules for project-specific patterns
[[rules]]
id = "openai-api-key-new-format"
description = "OpenAI API key (new sk-proj- format)"
regex = '''sk-proj-[A-Za-z0-9_-]{48,}'''
entropy = 3.5
keywords = ["sk-proj"]
tags = ["api-key", "openai", "high-risk"]

[[rules]]
id = "anthropic-claude-api-key"
description = "Anthropic Claude API key"
regex = '''sk-ant-api03-[A-Za-z0-9_-]{95,}'''
entropy = 4.0
keywords = ["sk-ant"]
tags = ["api-key", "anthropic", "high-risk"]

[[rules]]
id = "generic-high-entropy-string"
description = "Generic high-entropy string (potential secret)"
regex = '''(?i)(api[_-]?key|secret|token|password)[\"'\s]*[:=][\"'\s]*([A-Za-z0-9_-]{32,})'''
entropy = 4.5
keywords = ["api", "key", "secret", "token", "password"]
tags = ["generic-secret", "medium-risk"]

# Environment variable exposure
[[rules]]
id = "env-file-exposure"
description = "Prevent committing .env files"
path = '''^\.env.*$'''
tags = ["env-file", "high-risk"]

# Database connection strings
[[rules]]
id = "database-connection-string"
description = "Database connection string with credentials"
regex = '''(postgres|mysql|mongodb|redis)://[^:]+:[^@]+@[^/\s'"]+'''
keywords = ["postgres", "mysql", "mongodb", "redis"]
tags = ["database", "high-risk"]

# Private keys
[[rules]]
id = "private-key-pem"
description = "PEM-encoded private key"
regex = '''-----BEGIN ((EC|PGP|DSA|RSA|OPENSSH) )?PRIVATE KEY( BLOCK)?-----'''
keywords = ["BEGIN", "PRIVATE", "KEY"]
tags = ["private-key", "critical-risk"]

# JWT tokens
[[rules]]
id = "jwt-token"
description = "JSON Web Token (JWT)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
entropy = 3.0
keywords = ["eyJ"]
tags = ["jwt", "medium-risk"]

# GitHub tokens
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,}'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
tags = ["github", "high-risk"]
